<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optin</title>
  <style>
    :root{--bg:#0b1220;--btn:#3b82f6;--text:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:560px;margin:40px auto;padding:24px}
    input,button{width:100%;padding:12px;border:0;border-radius:10px;margin:8px 0}
    button{background:var(--btn);color:#fff;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1 data-slot="headline">Titre optin</h1>
  <ul data-slot="bullets"></ul>
  <header style="text-align:center;margin-bottom:16px">
  <img id="logo" alt="Logo" style="max-height:48px;display:none">
</header>

<section id="hero-image" data-optional="image" style="display:none">
  <img id="hero-img" style="max-width:100%;border-radius:12px">
</section>

  <form id="optin-form">
    <input name="name" placeholder="Ton prénom" required>
    <input name="email" type="email" placeholder="Ton email" required>
    <input type="hidden" name="userId">
    <input type="hidden" name="slug">
    <input type="hidden" name="type" value="tunnel">
    <input type="hidden" name="nextUrl">
    <button type="submit"><span data-slot="cta">Continuer</span></button>
  </form>
</main>


<script>
  // logge TOUT ce qui fuit en promesse ou erreur
  window.addEventListener('error', e => console.error('[window.onerror]', e.message, e.error || e));
  window.addEventListener('unhandledrejection', e => console.error('[unhandledrejection]', e.reason));
</script>

<script type="module" src="./js/firebase-init.js?v=fix3"></script>
<script type="module" src="./js/save-lead-tunnel.js?v=fix3"></script>
<script type="module">
  import { injectSlots } from "./js/inject-content.js?v=fix3";
  (async () => {
    const qs = new URLSearchParams(location.search);
    const slug = qs.get("slug");
    const cfg = await injectSlots({ slug, page: "optin" });
    // Remplit les hidden utilisés par save-lead-tunnel.js
    const f = document.getElementById("optin-form");
    f.userId.value = cfg.userId;
    f.slug.value = cfg.slug;
    // next : si nextSlug existe on l’utilise, sinon fallback incrémente -pX
    const nextSlug = cfg.flow?.nextSlug || (cfg.slug?.replace(/-p(\d+)$/, (_,n)=>`-p${(+n+1)}`));
    f.nextUrl.value = `checkout.html?slug=${nextSlug}&userId=${cfg.userId}`;
  })().catch(e => console.error("[optin] inject error", e));
</script>
</body>
</html>
