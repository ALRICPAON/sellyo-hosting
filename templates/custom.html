<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>{{seo.metaTitle}}</title>
  <meta name="description" content="{{seo.metaDescription}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{ --bg:#0b1220; --btn: {{ui.buttonColor}}; --text:#fff }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:880px;margin:0 auto;padding:24px;text-align:center}
    header{display:flex;justify-content:center;padding:16px 0}
    header img{max-height:56px}
    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .btn{display:inline-block;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-decoration:none}
    .btn-ghost{display:inline-block;padding:12px 16px;border-radius:12px;background:transparent;border:2px solid #fff;color:#fff;text-decoration:none;margin-left:8px}
    .media img,.media video{max-width:92%;max-height:360px;margin:12px auto;border-radius:14px;display:block}
  </style>
</head>
<body>
  <header><img src="{{brand.logoUrl}}" alt="Logo" onerror="this.style.display='none'"></header>
  <main>
    <section class="card">
      <div class="media">
        <video src="{{media.videoMp4}}" controls playsinline onerror="this.style.display='none'"></video>
        <img src="{{media.imageUrl}}" alt="" onerror="this.style.display='none'">
      </div>
      <h1>{{copy.title}}</h1>
      <p>{{copy.subtitle}}</p>
      <div style="margin:10px 0">{{copy.productDescription}}</div>
      <div style="margin-top:14px">
        <a class="btn" href="{{flow.nextHref}}">Étape suivante</a>
        <a class="btn-ghost" href="{{payment.paymentLink}}">{{copy.ctaText}}</a>
      </div>
    </section>
  </main>
</body>
</html>
