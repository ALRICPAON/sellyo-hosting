<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>{{seo.metaTitle}}</title>
  <meta name="description" content="{{seo.metaDescription}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{ --bg:#0b1220; --main: {{ui.mainColor}}; --btn: {{ui.buttonColor}}; --text:#fff }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:1000px;margin:0 auto;padding:24px}
    header{display:flex;justify-content:center;padding:16px 0} header img{max-height:56px}
    .hero{display:grid;gap:18px;grid-template-columns:1fr} @media(min-width:920px){.hero{grid-template-columns:1.1fr .9fr}}
    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .media video,.media img{width:100%;max-height:420px;border-radius:14px;display:block}
    h1{font-size:clamp(28px,3.6vw,46px);margin:8px 0} .sub{opacity:.9;margin:0 0 10px}
    .timer{font-weight:800;text-align:center;margin:8px 0 16px;font-size:20px;color:#facc15}
    form input{width:100%;padding:12px;border-radius:10px;border:0;margin:8px 0;background:#ffffff12;color:#fff}
    .btn{display:block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:900;text-align:center;text-decoration:none;border:0;cursor:pointer}
  </style>
</head>
<body>
  <header><img src="{{brand.logoUrl}}" alt="Logo" onerror="this.style.display='none'"></header>
  <main>
    <section class="hero">
      <div class="card">
        <div class="media">
          <video src="{{media.videoMp4}}" controls playsinline onerror="this.style.display='none'"></video>
          <img src="{{media.imageUrl}}" alt="" onerror="this.style.display='none'">
        </div>
        <h1>{{copy.title}}</h1>
        <p class="sub">{{copy.subtitle}}</p>
        <div id="timer" class="timer"></div>
        <div>{{copy.productDescription}}</div>
      </div>

      <aside class="card">
        <form id="lead-form" data-role="capture" data-next="{{flow.nextHref}}">
          <!-- Tu peux pousser des champs spécifiques webinar via `formFields` -->
          {{formFields}}
          <input type="hidden" name="userId" value="{{userId}}" />
          <input type="hidden" name="pageSlug" value="{{slug}}" />
          <input type="hidden" name="slug" value="{{slug}}" />
          <input type="hidden" name="type" value="tunnel" />
          <input type="hidden" name="nextUrl" value="{{flow.nextHref}}" />
          <button type="submit" class="btn">{{copy.ctaText}}</button>
        </form>
      </aside>
    </section>
  </main>

  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/firebase-init.js"></script>
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/save-lead-tunnel.js"></script>
  <script>
    (function(){
      const evergreen = parseInt('{{timers.evergreenMinutes}}',10)||0;
      const deadlineISO = '{{timers.deadlineISO}}';
      const t = document.getElementById('timer');
      function renderTimer(sec){ if(sec<=0){ t.textContent='Le live commence !'; return; } const m=Math.floor(sec/60), s=sec%60; t.textContent='Débute dans '+m+'m '+('0'+s).slice(-2)+'s';}
      let total=0; if(evergreen>0) total=evergreen*60; else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      const tick=()=>{renderTimer(total--); if(total>=0) setTimeout(tick,1000)}; tick();
    })();
  </script>
</body>
</html>
