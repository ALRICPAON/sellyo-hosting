<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>test optin origine</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg: #0061ff;
      --btn: #b92d5d;
      --text:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:24px}
    header{display:flex;justify-content:center;padding:16px 0}
    header img{max-height:56px;display:block}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}
    form input,form textarea,form select{width:100%;padding:12px;border-radius:10px;border:0;margin:8px 0;background:#ffffff12;color:#fff}

    /* Grilles */
    .grid{display:grid;gap:18px}
    .two-cols{grid-template-columns:1fr}
    @media(min-width:880px){.two-cols{grid-template-columns:1.1fr .9fr}}
    /* ===== Grille adaptative formulaire | média ===== */
    #main-zone{
      display:grid;
      gap:18px;
      grid-template-columns:1fr; /* défaut = une colonne */
    }
    @media(min-width:880px){
      #main-zone.has-media{ grid-template-columns:1fr 1fr; } /* si média => 2 colonnes */
    }

    /* Formulaire centré verticalement quand seul */
    #left-col{ display:flex; flex-direction:column; justify-content:center; }

    .pair{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:880px){.pair{grid-template-columns:1fr 1fr}}
    /* Média responsive */
    #right-media img, #right-media video{
      width:100%; max-height:420px; object-fit:cover; border-radius:12px; display:block;
    }

    .argu-grid{display:grid;gap:14px;grid-template-columns:1fr}
    @media(min-width:880px){.argu-grid{grid-template-columns:1fr 0.9fr}}

    .media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
    .hide{display:none}
    .text-center{text-align:center}
  </style>
</head>
<body>
  <main>
    <header>
      <img src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-optin-origine-nov5a%2Flogo-1755856609966?alt=media&token=8077d05b-c93f-4df0-ae99-e5863735522c" alt="Logo">
    </header>
    <div class="hero">
      <h1>test optine</h1>
      <p class="sub">test</p>
    </div>
    <section>
      <div id="desc">test pour retrouver ma page</div>
    </section>

    <!-- 3) Zone principale : G = image + formulaire -->
    <section class="grid two-cols" id="main-zone">
      <!-- Colonne gauche -->
    <!-- 3) Zone principale : Formulaire | Média -->
    <section id="main-zone">
      <!-- Colonne gauche : FORM -->
      <div class="card" id="left-col">
        <div class="pair" id="left-pair">
          <div class="media" id="left-media">
            <img id="img-left" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-optin-origine-nov5a%2Fpage1-hero-1755856611601?alt=media&token=67d189b0-d4da-4c97-9514-fcb97649e492" alt="" onerror="this.style.display='none'">
          </div>

          <div>
            <div id="timer" class="timer hide"></div>

            <!-- Spécification des champs (JSON) -->
            <script id="form-fields-json" type="application/json">{"name":true,"firstname":true,"email":true,"phone":true,"address":true}</script>

            <!-- Form -->
            <form id="lead-form" data-role="capture" data-next=".html">
              <div id="form-visible"></div>

              <!-- requis pour save-lead-tunnel.js -->
              <input type="hidden" name="userId" value="pOoqftYacXhirXtjxVk60Or09nm2" />
              <input type="hidden" name="pageSlug" value="test-optin-origine-nov5a-p1" />
              <input type="hidden" name="slug" value="test-optin-origine-nov5a-p1" />
              <input type="hidden" name="type" value="tunnel" />
              <input type="hidden" name="nextUrl" value=".html" />

              <button type="submit" class="btn">je test</button>

              <!-- Garantie sous le formulaire -->
              <div id="gua" class="hide" style="margin-top:10px"><em>garantie</em></div>
            </form>
          </div>
        <div>
          <div id="timer" class="timer hide"></div>

          <!-- Spécification des champs (JSON) -->
          <script id="form-fields-json" type="application/json">{"name":true,"firstname":true,"email":true,"phone":true,"address":true}</script>

          <!-- Form -->
          <form id="lead-form" data-role="capture" data-next=".html">
            <div id="form-visible"></div>

            <!-- requis pour save-lead-tunnel.js -->
            <input type="hidden" name="userId" value="pOoqftYacXhirXtjxVk60Or09nm2" />
            <input type="hidden" name="pageSlug" value="test-optin-origine-nov5a-p1" />
            <input type="hidden" name="slug" value="test-optin-origine-nov5a-p1" />
            <input type="hidden" name="type" value="tunnel" />
            <input type="hidden" name="nextUrl" value=".html" />

            <button type="submit" class="btn">je test</button>

            <!-- Garantie sous le formulaire -->
            <div id="gua" class="hide" style="margin-top:10px"><em>garantie</em></div>
          </form>
        </div>
      </div>

      <!-- Colonne droite : MEDIA (image ou vidéo) -->
      <div class="card" id="right-media">
        <img id="img-media" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-optin-origine-nov5a%2Fpage1-hero-1755856611601?alt=media&token=67d189b0-d4da-4c97-9514-fcb97649e492" alt="" onerror="this.style.display='none'">
        <video id="vid-media" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-optin-origine-nov5a%2Fpage1-video-1755856612636?alt=media&token=c45c11ab-fd3c-49c3-b67c-5924cd0bb0b2" controls playsinline onerror="this.style.display='none'"></video>
      </div>
    </section>

    <!-- 4) Bloc argumentaire SOUS le formulaire : gauche = textes, droite = vidéo -->

    <section id="argu-zone" class="argu-grid">
      <div id="argu-left">
        <h3>Problème</h3>
        <p>probleme</p>
        <h3>Solution</h3>
        <p>solution</p>
        <h3>Bénéfices</h3>
        <p>1, 2, 3, 4</p>
      </div>
      <div id="argu-video" style="display:none">
        <video id="vid-argu" src="" controls playsinline onerror="this.style.display='none'"></video>
      </div>
    </section>

    <!-- 5) Témoignages & FAQ -->
    <div id="testi" class="hide"><div class="testimonial-item">"supers"</div></div>
    <div id="faq" class="hide"><div class="faq-item"><strong>FAQ test</strong><br/></div></div>
  </main>

  <script>
    // 2) Logique médias/form & argumentaire
    (function(){
      // Haut : image + form
      const mainZone = document.getElementById('main-zone');
      const leftCol = document.getElementById('left-col');
      const leftPair = document.getElementById('left-pair');
      const leftMedia = document.getElementById('left-media');
      const imgLeft = document.getElementById('img-left');

      const hasImg = !!cleanText(imgLeft.getAttribute('src'));
      if (!hasImg) {
        leftMedia.style.display = 'none';
        leftPair.style.gridTemplateColumns = '1fr';
        mainZone.classList.remove('two-cols');
      const mainZone   = document.getElementById('main-zone');
      const leftCol    = document.getElementById('left-col');
      const rightMedia = document.getElementById('right-media');
      const img        = document.getElementById('img-media');
      const vid        = document.getElementById('vid-media');

      const hasImg = !!cleanText(img.getAttribute('src'));
      const hasVid = !!cleanText(vid.getAttribute('src'));

      if (hasImg || hasVid) {
        // 2 colonnes
        mainZone.classList.add('has-media');
      } else {
        // 1 colonne centrée
        if (rightMedia) rightMedia.style.display = 'none';
        mainZone.classList.remove('has-media');
        leftCol.classList.add('fun');
      }

      // Bas : argumentaire + vidéo
      const arguZone = document.getElementById('argu-zone');
      const vidWrap  = document.getElementById('argu-video');
      const vid      = document.getElementById('vid-argu');
      const hasVid   = !!cleanText(vid.getAttribute('src'));
      const vidArgu  = document.getElementById('vid-argu');
      const hasVidArgu = !!cleanText(vidArgu.getAttribute('src'));

      if (!hasVid) {
        // pas de vidéo -> une seule colonne + centrage du texte
      if (!hasVidArgu) {
        arguZone.style.gridTemplateColumns = '1fr';
        document.getElementById('argu-left').classList.add('text-center');
        vidWrap.style.display = 'none';
      }
    })();

    // 3) Affichages conditionnels + timer
    (function(){
      // Garantie visible si contenu
      const gua = document.getElementById('gua');
      if (gua && cleanText(gua.textContent)) { gua.classList.remove('hide'); }

      // Témoignages & FAQ (en bas)
      ['testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        const inner=el.querySelector('div'); const txt=cleanText(inner? inner.textContent: '');
        if (txt) el.classList.remove('hide');
      });

      // Progress bar
      const prog = document.getElementById('progress');
      if (prog && cleanText(prog.textContent)) prog.classList.remove('hide');

      // Timer
      const evergreen = parseInt('30',10)||0;
      const deadlineISO = cleanText('');
      const t = document.getElementById('timer');
      function render(sec){ if(sec<=0){ t.textContent='Offre expirée'; return; } const m=Math.floor(sec/60), s=sec%60; t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s'; }
      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      if(total>0){ t.classList.remove('hide'); (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })(); }
    })();

    // 4) Pixels (vides = pas d’injection)
    (function(){
      const clean = cleanText;
      var fb=clean(''); if(fb){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;t.src='https://connect.facebook.net/en_US/fbevents.js';
      s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script'); fbq('init', fb); fbq('track','PageView');}
      var gtm=clean(''); if(gtm){var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtm.js?id='+gtm;document.head.appendChild(s)}
    })();
  </script>
</body>
