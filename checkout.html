<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement</title>
  <script src="https://js.stripe.com/v3"></script>
  <style>
    :root{--bg:#0b1220;--btn:#3b82f6;--text:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:720px;margin:40px auto;padding:24px}
    header{display:flex;justify-content:center;margin-bottom:16px}
    #logo{max-height:48px;display:none}
    .card{background:#ffffff10;padding:16px;border-radius:12px}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;cursor:pointer;margin-top:12px}
    .muted{opacity:.75}
    ul{padding-left:18px}
  </style>
</head>
<body>
<main>
  <header><img id="logo" alt="Logo"></header>

  <h1 data-slot="headline">Finalisez votre commande</h1>
  <p class="muted" data-slot="subtitle"></p>

  <section id="hero-image" data-optional="image"><img id="hero-img" alt=""></section>
  <section id="hero-video" data-optional="video" style="display:none">
    <video id="hero-mp4" controls style="display:none"></video>
    <div id="hero-embed" style="aspect-ratio:16/9;display:none"></div>
  </section>

  <section class="card">
    <h3>Récapitulatif</h3>
    <p data-slot="productRecap"></p>
    <p data-slot="productDescription"></p>
    <p><strong>Prix :</strong> <span id="amount"></span> <span id="currency"></span></p>
    <div class="muted" id="checkout-msg"></div>
    <button id="pay-btn"><span data-slot="cta">Payer maintenant</span></button>
  </section>

  <section style="margin-top:16px">
    <h3>Questions fréquentes</h3>
    <div id="faqs"></div>
  </section>
</main>

<script type="module">
  import { injectSlots } from "./js/inject-content.js";
  const $ = (s)=>document.querySelector(s);
  const setText = (sel,v)=>{ const el=$(sel); if(el) el.textContent=v||""; }
  function renderFaqs(list=[]) {
    const host = document.getElementById("faqs");
    host.innerHTML = (list||[]).map(f=>`
      <details><summary>${f.q || "Question"}</summary><p>${f.a || ""}</p></details>
    `).join("") || '<p class="muted">Aucune question.</p>';
  }

  (async () => {
    const qs = new URLSearchParams(location.search);
    const slug = qs.get("slug");
    const uid  = qs.get("userId");

    const cfg = await injectSlots({ slug, page: "checkout" });

    // Texte élargi
    setText('[data-slot="subtitle"]', cfg.subtitle || "");
    setText('[data-slot="productDescription"]', cfg.productDescription || "");
    setText('[data-slot="productRecap"]', cfg.productRecap || cfg.productDescription || "");
    renderFaqs(cfg.faqs || []);

    // Pricing
    const amount = Number(cfg.pricing?.amount || 0);
    const currency = (cfg.pricing?.currency || "").toUpperCase();
    $("#amount").textContent = amount ? (amount/100).toFixed(2) : "—";
    $("#currency").textContent = currency || "";

    // Stripe / Payment
    const priceFromUrl = qs.get("priceId");
    const effectivePriceId = priceFromUrl || cfg.pricing?.priceId || "";
    const btn = document.getElementById("pay-btn");
    const msg = document.getElementById("checkout-msg");

    // Optionnel : paymentLink (si tu le passes dans ton JSON global)
    const paymentLink = cfg.paymentLink || "";

    if (!effectivePriceId && !paymentLink) {
      msg.textContent = "Configuration paiement incomplète : aucun priceId/Payment Link détecté.";
      btn.disabled = true;
      return;
    }

    btn.addEventListener("click", async () => {
      try {
        if (paymentLink) {
          // redirection directe lien Stripe
          location.href = paymentLink;
          return;
        }
        // Si tu ajoutes stripePk côté front/global, lis-le ici :
        const stripePk = cfg.stripePk || ""; // à alimenter si nécessaire
        if (!stripePk) {
          msg.textContent = "Clé Stripe publique manquante. Ajoute-la au JSON ou utilise un Payment Link.";
          return;
        }
        const stripe = window.Stripe(stripePk);
        await stripe.redirectToCheckout({ lineItems: [{ price: effectivePriceId, quantity: 1 }], mode: 'payment', successUrl: location.href, cancelUrl: location.href });
      } catch (e) {
        console.error("[checkout] pay error", e);
        msg.textContent = "Erreur lors de la redirection vers le paiement.";
      }
    });
  })().catch(e => console.error("[checkout] inject error", e));
</script>
</body>
</html>
