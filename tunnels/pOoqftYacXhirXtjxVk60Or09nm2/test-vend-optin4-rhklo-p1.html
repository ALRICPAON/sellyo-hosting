<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>test vend optin4</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg: #7b219f;
      --btn: #e63b7a;
      --text:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:24px}
    header{display:flex;justify-content:center;padding:16px 0}
    header img{max-height:56px;display:block}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}
    form input,form textarea,form select{width:100%;padding:12px;border-radius:10px;border:0;margin:8px 0;background:#ffffff12;color:#fff}

    /* Grilles */
    .grid{display:grid;gap:18px}
    .two-cols{grid-template-columns:1fr}
    @media(min-width:880px){.two-cols{grid-template-columns:1.1fr .9fr}}

    .pair{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:880px){.pair{grid-template-columns:1fr 1fr}}

    .media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
    .media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}
    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
    .hide{display:none}
    .text-center{text-align:center}
    .fun{background:linear-gradient(135deg,#ffffff12,#ffffff08)}
  </style>
</head>
<body>
  <main>
    <header>
      <img id="logo" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vend-optin4-rhklo%2Flogo-1755862988172?alt=media&token=ec55f91c-5b72-4499-bc5e-759817b0aa99" alt="Logo" onerror="this.style.display='none'">
    </header>

    <!-- 1) Hero -->
    <section class="hero" id="hero">
      <h1 id="title">test capture</h1>
      <p class="sub" id="subtitle">test sous titre</p>
    </section>

    <!-- 2) Description avant le formulaire -->
    <section class="card" id="desc-wrap">
      <div id="desc">test description</div>
    </section>

    <!-- 3) Zone centrale : G = image + formulaire / D = textes + vidéo -->
    <section class="grid two-cols" id="main-zone">
      <!-- Colonne gauche -->
      <div class="card" id="left-col">
        <div class="pair" id="left-pair">
          <div class="media" id="left-media">
            <img id="img-left" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vend-optin4-rhklo%2Fpage1-hero-1755862989957?alt=media&token=ea21bfb0-9fca-4729-8cc0-d4c542f311ec" alt="" onerror="this.style.display='none'">
          </div>

          <div>
            <div id="timer" class="timer hide"></div>

            <!-- JSON des champs -->
            <script id="form-fields-json" type="application/json">{"name":true,"firstname":true,"email":true,"phone":true,"address":true}</script>

            <!-- Form -->
            <form id="lead-form" data-role="capture">
              <div id="form-visible"></div>

              <!-- requis pour save-lead-tunnel.js -->
              <input type="hidden" name="userId" value="pOoqftYacXhirXtjxVk60Or09nm2" />
              <input type="hidden" name="pageSlug" value="test-vend-optin4-rhklo-p1" />
              <input type="hidden" name="slug" value="test-vend-optin4-rhklo-p1" />
              <input type="hidden" name="type" value="tunnel" />
              <input type="hidden" id="nextUrl-hidden" name="nextUrl" value="" />

              <button type="submit" class="btn" id="cta-btn">je test</button>

              <!-- Garantie sous le formulaire -->
              <div id="gua" class="hide" style="margin-top:10px"><em>garantie</em></div>
            </form>

            <!-- CTA lien (utilisé SEULEMENT si cta.action = 'paiement' ou 'lien') -->
            <a id="cta-link" class="btn hide" href="#" rel="nofollow noopener">je test</a>
          </div>
        </div>
      </div>

      <!-- Colonne droite -->
      <div class="card" id="right-col">
        <!-- On affiche UNIQUEMENT le contenu, pas les titres -->
        <div id="prob">probleme</div>
        <div id="sol">solution test</div>
        <div id="ben">bénéfice test</div>
        <div id="bul">1, 2, 3</div>

        <!-- Vidéo en bas de la colonne droite (mp4 ou embed si pas de mp4) -->
        <div class="media" id="right-video">
          <video id="vid-right" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vend-optin4-rhklo%2Fpage1-video-1755862990971?alt=media&token=7b5f30b6-8ff8-439c-8161-f08bee4ba7b3" controls playsinline onerror="this.style.display='none'"></video>
          <iframe id="emb-right" src="" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- 4) Témoignages + FAQ en bas -->
    <section class="card hide" id="testi">
      <h3>Témoignages</h3>
      <div></div>
    </section>

    <section class="card hide" id="faq">
      <h3>FAQ</h3>
      <div></div>
    </section>

    <!-- 5) Bonus / Téléchargement (nouvelle règle) -->
    <section class="card hide" id="bonus">
      <h3>Bonus</h3>
      <p id="bonus-desc">Votre ressource est prête.</p>
      <a id="bonus-link" class="btn" href="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vend-optin4-rhklo%2Fpage1-product-1755862993685?alt=media&token=79663a69-aac1-4054-a88a-41264af46f60" download>Télécharger</a>
    </section>
  </main>

  <!-- Firebase + capture leads -->
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/firebase-init.js"></script>
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/save-lead-tunnel.js"></script>

  <script>
    // 0) Anti-parasites (retire d'éventuels ```html ... ```)
    (function(){
      const kill = (s)=> (s||'').replace(/```html?/gi,'').replace(/```/g,'');
      ['desc','prob','sol','ben','bul','testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        el.innerHTML = kill(el.innerHTML||'');
      });
    })();

    // Helpers
    const cleanText = (s) => (s||"").toString().replace(/^['"\\s]+|['"\\s]+$/g,'').trim();
    const isHttp = (u)=>{ try{ const x=new URL(u); return x.protocol==='http:'||x.protocol==='https:'; }catch(e){ return false; } };

    // 1) Sécurisation couleur de fond (fallback si mainColor vide)
    (function(){
      const root = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (!root || root==='{{ui.mainColor}}'){
        document.documentElement.style.setProperty('--bg', '{{ui.backgroundColor}}'.trim() || '#111');
      }
    })();

    // 2) Logo visible si présent + masquages de blocs vides
    (function(){
      const logo=document.getElementById('logo');
      if (logo && cleanText(logo.getAttribute('src'))) { logo.style.display='block'; }

      const title=document.getElementById('title');
      const subtitle=document.getElementById('subtitle');
      const descWrap=document.getElementById('desc-wrap');
      if (!cleanText(title.textContent) && !cleanText(subtitle.textContent)) document.getElementById('hero').style.display='none';
      if (!cleanText(subtitle.textContent)) subtitle.style.display='none';
      if (!cleanText(document.getElementById('desc').textContent)) descWrap.style.display='none';
    })();

    // 3) Génération des inputs visibles (accepte array / objet / string)
    (function(){
      const host = document.getElementById('form-visible');
      const raw = document.getElementById('form-fields-json')?.textContent || '[]';

      function inputHtml(type, name, placeholder, required=true, options=null){
        const req = required ? 'required' : '';
        if (type==='textarea') return `<textarea name="${name}" placeholder="${placeholder}" ${req}></textarea>`;
        if (type==='select' && Array.isArray(options)){
          const opts = options.map(o => `<option value="${(o.value??o)}">${(o.label??o)}</option>`).join('');
          return `<select name="${name}" ${req}>${opts}</select>`;
        }
        return `<input name="${name}" type="${type}" placeholder="${placeholder}" ${req} />`;
      }
      function fromArray(arr){
        if (!Array.isArray(arr)) return '';
        return arr.map(f=>{
          const t=(f.type||'text').toLowerCase();
          const n=f.name||'field';
          const ph=f.placeholder||f.label||n;
          return inputHtml(t,n,ph,!!f.required,Array.isArray(f.options)?f.options:null);
        }).join('');
      }
      function fromObject(obj){
        // Legacy flags: {name:true, firstname:true, email:true, phone:true, address:true}
        const order = ['firstname','name','email','phone','address'];
        const keys  = order.filter(k => obj[k]).concat(Object.keys(obj).filter(k => !order.includes(k) && obj[k]));
        if (keys.length === 0) return '';
        return keys.map(k=>{
          const key=k.toLowerCase();
          if (key==='email')     return inputHtml('email','email','Votre email');
          if (key==='phone')     return inputHtml('tel','phone','Votre téléphone');
          if (key==='address')   return inputHtml('textarea','address','Votre adresse');
          if (key==='firstname') return inputHtml('text','firstname','Votre prénom');
          if (key==='name'||key==='lastname') return inputHtml('text','name','Votre nom');
          return inputHtml('text', key, key);
        }).join('');
      }
      function fromString(str){
        const parts = (str||'').split(',').map(s=>s.trim()).filter(Boolean);
        if (parts.length===0) return '';
        return fromObject(Object.fromEntries(parts.map(p=>[p,true])));
      }

      let fields; try { fields = JSON.parse(raw); } catch(e){ fields = raw; }
      let html='';
      if (Array.isArray(fields)) html = fromArray(fields);
      else if (fields && typeof fields==='object') html = fromObject(fields);
      else if (typeof fields==='string') html = fromString(fields);

      if (!html){ html = inputHtml('email','email','Votre email'); }
      host.innerHTML = html;
    })();

    // 4) Logique médias & layout (pas de doublon)
    (function(){
      const mainZone = document.getElementById('main-zone');
      const leftCol  = document.getElementById('left-col');
      const leftPair = document.getElementById('left-pair');
      const leftMedia= document.getElementById('left-media');
      const imgLeft  = document.getElementById('img-left');

      const rightVideoWrap = document.getElementById('right-video');
      const vidRight = document.getElementById('vid-right');
      const embRight = document.getElementById('emb-right');

      const hasImg = !!cleanText(imgLeft.getAttribute('src'));
      const hasVid = !!cleanText(vidRight.getAttribute('src'));
      const hasEmb = !!cleanText(embRight.getAttribute('src')) && !hasVid;

      if (hasEmb) embRight.classList.remove('hide');

      if (hasImg && (hasVid || hasEmb)) {
        // layout par défaut : image à gauche du formulaire, vidéo en bas à droite
      } else if (hasImg && !(hasVid || hasEmb)) {
        // uniquement image
        mainZone.classList.remove('two-cols'); // on repasse en 1 colonne (form + contenus dessous)
      } else if (!hasImg && (hasVid || hasEmb)) {
        // pas d'image, mais vidéo à droite => on garde deux colonnes si contenu texte à droite
        // pas de duplication d'image
        leftMedia.style.display='none';
        leftPair.style.gridTemplateColumns='1fr';
      } else {
        // aucun média : form centré + style fun
        leftMedia.style.display='none';
        leftPair.style.gridTemplateColumns='1fr';
        mainZone.classList.remove('two-cols');
        leftCol.classList.add('fun');
      }
    })();

    // 5) CTA / nextHref : résolution robuste (évite ".html")
    (function(){
      const ctaAction = cleanText('{{cta.action}}').toLowerCase(); // '', 'capture', 'paiement', 'lien'
      const ctaLink   = cleanText('{{cta.paymentLink}}');
      const ns1 = cleanText('.html');
      const ns2 = cleanText('.html');
      const ns3 = cleanText('{{cta.nextSlug}}');
      const ns4 = cleanText('{{flow.nextSlug}}');

      let nextHref = ns1 || ns2 || '';
      if (nextHref === '.html') nextHref = '';
      if (!nextHref){
        const slug = ns3 || ns4;
        if (slug) nextHref = slug.endsWith('.html') ? slug : (slug + '.html');
      }
      const hidden = document.getElementById('nextUrl-hidden');
      if (hidden) hidden.value = nextHref || '';

      const form = document.getElementById('lead-form');
      const link = document.getElementById('cta-link');

      if (ctaAction === 'paiement' || ctaAction === 'lien'){
        form.classList.add('hide');
        link.classList.remove('hide');
        link.href = (ctaAction==='paiement' && isHttp(ctaLink)) ? ctaLink : (nextHref || '#');
      } else {
        form.classList.remove('hide'); // capture par défaut
        link.classList.add('hide');
      }
    })();

    // 6) Témoignages / FAQ / Timer
    (function(){
      const gua = document.getElementById('gua');
      if (gua && cleanText(gua.textContent)) gua.classList.remove('hide');

      ['testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        const inner=el.querySelector('div'); const txt=cleanText(inner? inner.textContent: '');
        if (txt) el.classList.remove('hide');
      });

      // Timer
      const evergreen = parseInt('',10)||0;
      const deadlineISO = cleanText('');
      const t = document.getElementById('timer');
      function render(sec){ if(sec<=0){ t.textContent='Offre expirée'; return; } const m=Math.floor(sec/60), s=sec%60; t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s'; }
      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      if(total>0){ t.classList.remove('hide'); (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })(); }
    })();

    // 7) Bonus / fichiers (pageDelivery*)
    (function(){
      const mode = cleanText('').toLowerCase(); // "direct" | "aucun" | ""
      const url  = cleanText('https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vend-optin4-rhklo%2Fpage1-product-1755862993685?alt=media&token=79663a69-aac1-4054-a88a-41264af46f60') || cleanText('https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vend-optin4-rhklo%2Fpage1-product-1755862993685?alt=media&token=79663a69-aac1-4054-a88a-41264af46f60') || cleanText('');
      const file = cleanText('') || cleanText('') || cleanText('');
      const href = isHttp(url) ? url : (isHttp(file) ? file : '');

      const wrap = document.getElementById('bonus');
      const link = document.getElementById('bonus-link');

      if (mode==='direct' && href){
        link.href = href;
        wrap.classList.remove('hide');
      }
    })();

    // 8) Pixels (injection si présents)
    (function(){
      const fb=''.trim();
      if (fb){
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;
          n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src='https://connect.facebook.net/en_US/fbevents.js';
          s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script');
        fbq('init', fb); fbq('track','PageView');
      }
      const gtm=''.trim();
      if (gtm){
        var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtm.js?id='+encodeURIComponent(gtm);
        document.head.appendChild(s);
      }
    })();
  </script>
</body>
</html>
