<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>mercredi 10</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg: #00ccff;
      --btn: #00ccff;
      --text:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:24px}

    header{display:flex;justify-content:center;padding:16px 0}
    #logo{max-height:56px;display:none}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}

    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}
    form input,form textarea,form select{width:100%;padding:12px;border-radius:10px;border:0;margin:8px 0;background:#ffffff12;color:#fff}

    .grid{display:grid;gap:18px}

    /* ===== Bloc A : image|vid + formulaire ===== */
    #block-a{max-width:1100px;margin:0 auto}
    #pair-a{display:grid;gap:12px;grid-template-columns:1fr}
    @media(min-width:880px){ #pair-a.two-cols{ grid-template-columns:1fr 1fr; } }

    .media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
    .media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}
    .media .hide{display:none!important;}

    /* ===== Bloc B : texte à gauche + vidéo à droite ===== */
    #argu-grid{display:grid;gap:14px;grid-template-columns:1fr}
    @media(min-width:880px){ #argu-grid.two-cols{ grid-template-columns:1fr 0.9fr; } }

    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
    .hide{display:none}
    .text-center{text-align:center}
    .fun{background:linear-gradient(135deg,#ffffff12,#ffffff08)}
  </style>
</head>

        <div class="media" id="media-a">
  <img id="img-a" src="" alt="" onerror="this.style.display='none'">

</div>

          <form id="lead-form" data-role="capture" data-next="">
            <div id="form-visible"></div>

            <input type="hidden" name="userId" value="pOoqftYacXhirXtjxVk60Or09nm2" />

            <input type="hidden" name="slug" value="mercredi-10-5n12m-p1" />

    <!-- ===== Bloc B : Texte à gauche + Vidéo à droite ===== -->

  <!-- Firebase + capture -->
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/firebase-init.js"></script>
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/save-lead-tunnel.js"></script>

  <script>
    // Anti-parasites
    (function(){
      const kill = (s)=> (s||'').replace(/```html?/gi,'').replace(/```/g,'');
      ['desc','prob','sol','ben','bul','testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        el.innerHTML = kill(el.innerHTML||'');
      });
    })();

    const cleanText = (s) => (s||"").toString().replace(/^[\'"\\\s]+|[\'"\\\s]+$/g,'').trim();
    const isHttp = (u)=>{ try{ const x=new URL(u); return x.protocol==='http:'||x.protocol==='https:'; }catch(e){ return false; } };

    // Couleur de fond fallback
    (function(){
  const v=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (!v || v==='{{ui.mainColor}}'){
    document.documentElement.style.setProperty('--bg', '{{ui.mainColor}}'.trim() || '#111');
  }
})();

    // Logo + blocs vides
    (function(){
      const logo=document.getElementById('logo');
      if (logo && cleanText(logo.getAttribute('src'))) logo.style.display='block';

      const title=document.getElementById('title');
      const subtitle=document.getElementById('subtitle');
      const desc=document.getElementById('desc');
      if (!cleanText(title.textContent) && !cleanText(subtitle.textContent)) document.getElementById('hero').style.display='none';
      if (!cleanText(subtitle.textContent)) subtitle.style.display='none';
      if (!cleanText(desc.textContent)) document.getElementById('desc-wrap').style.display='none';
    })();

    // Form fields: accepte array | objet flags | string "email,name"
    (function(){
      const host = document.getElementById('form-visible');
      const raw  = document.getElementById('form-fields-json')?.textContent || '[]';

      function input(type, name, placeholder, required=true, options=null){
        const req = required ? 'required' : '';
        if (type==='textarea') return `<textarea name="${name}" placeholder="${placeholder}" ${req}></textarea>`;
        if (type==='select' && Array.isArray(options)){
          const opts=options.map(o=>`<option value="${(o.value??o)}">${(o.label??o)}</option>`).join('');
          return `<select name="${name}" ${req}>${opts}</select>`;
        }
        return `<input name="${name}" type="${type}" placeholder="${placeholder}" ${req}/>`;
      }
      function fromArray(arr){
        if (!Array.isArray(arr)) return '';
        return arr.map(f=>{
          const t=(f.type||'text').toLowerCase(), n=f.name||'field', ph=f.placeholder||f.label||n;
          return input(t,n,ph,!!f.required,Array.isArray(f.options)?f.options:null);
        }).join('');
      }
      function fromObject(obj){
        const order=['firstname','name','email','phone','address'];
        const keys=order.filter(k=>obj[k]).concat(Object.keys(obj).filter(k=>!order.includes(k) && obj[k]));
        if (keys.length===0) return '';
        return keys.map(k=>{
          const key=k.toLowerCase();
          if (key==='email') return input('email','email','Votre email');
          if (key==='phone') return input('tel','phone','Votre téléphone');
          if (key==='address') return input('textarea','address','Votre adresse');
          if (key==='firstname') return input('text','firstname','Votre prénom');
          if (key==='name'||key==='lastname') return input('text','name','Votre nom');
          return input('text',key,key);
        }).join('');
      }
      function fromString(str){
        const parts=(str||'').split(',').map(s=>s.trim()).filter(Boolean);
        if (!parts.length) return '';
        return fromObject(Object.fromEntries(parts.map(p=>[p,true])));
      }

      let fields; try{ fields=JSON.parse(raw); }catch(e){ fields=raw; }
      let html='';
      if (Array.isArray(fields)) html=fromArray(fields);
      else if (fields && typeof fields==='object') html=fromObject(fields);
      else if (typeof fields==='string') html=fromString(fields);

      if (!html) html=input('email','email','Votre email');
      host.innerHTML=html;
    })();

    /* === Layout logique === */
(function(){
  const mediaA   = document.getElementById('media-a');
  const imgA     = document.getElementById('img-a');
  const vidA     = document.getElementById('vid-a');
  const pairA    = document.getElementById('pair-a');

  const vidB     = document.getElementById('vid-b');
  const embB     = document.getElementById('emb-b');
  const arguGrid = document.getElementById('argu-grid');
  const arguWrap = document.getElementById('argu-video');

  const isHttp = (u)=>{ try{ const x=new URL((u||'').trim()); return x.protocol==='http:'||x.protocol==='https:'; }catch(_){ return false; } };

  const imgUrl = (imgA?.getAttribute('src')||'').trim();
  const hasImg = isHttp(imgUrl);
  const hasVidB = isHttp(vidB?.getAttribute('src')||'');
  const hasEmbB = isHttp(embB?.getAttribute('src')||'');

  // 1) Si pas d'image mais média en B -> déplacer vers A
  if (!hasImg && (hasVidB || hasEmbB)) {
    if (mediaA) {
      mediaA.innerHTML = '';
      if (imgA) imgA.style.display = 'none';
    }

    if (hasVidB && vidB && mediaA) {
      mediaA.appendChild(vidB);
      vidB.style.display = 'block';
      vidB.classList.remove('hide');
    } else if (hasEmbB && embB && mediaA) {
      mediaA.appendChild(embB);
      embB.style.display = 'block';
      embB.classList.remove('hide');
    }

    if (arguWrap) arguWrap.style.display = 'none';
    if (arguGrid) arguGrid.classList.remove('two-cols');

    if (pairA) pairA.classList.add('two-cols');

    if (vidA) { vidA.removeAttribute('src'); vidA.style.display='none'; vidA.classList.add('hide'); }
