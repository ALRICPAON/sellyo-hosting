<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>{{seo.metaTitle}}</title>
  <meta name="description" content="{{seo.metaDescription}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{ --bg:#0b1220; --btn: {{ui.buttonColor}}; --text:#fff }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:820px;margin:0 auto;padding:24px}
    header{display:flex;justify-content:center;padding:16px 0}
    header img{max-height:56px}
    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .btn{display:block;width:100%;padding:16px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:900;text-align:center;text-decoration:none}
    .price{font-size:28px;font-weight:900;margin:6px 0;text-align:center}
    .small{opacity:.85}
  </style>
</head>
<body>
  <header><img src="{{brand.logoUrl}}" alt="Logo" onerror="this.style.display='none'"></header>
  <main>
    <section class="card">
      <h1>{{copy.title}}</h1>
      <p class="small">{{copy.subtitle}}</p>
      <div style="margin:12px 0">{{copy.productDescription}}</div>
      <div class="price">{{payment.price}} {{payment.currency}}</div>
      <a class="btn" href="{{payment.paymentLink}}">Payer maintenant</a>
      <p class="small" style="margin-top:12px"><em>{{copy.guarantee}}</em></p>
    </section>
  </main>
</body>
</html>
