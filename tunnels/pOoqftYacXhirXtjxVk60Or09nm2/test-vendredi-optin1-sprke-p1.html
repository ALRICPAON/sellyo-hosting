<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>test vendredi optin1</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg: #61177c;
      --btn: #5e30eb;
      --text:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:24px}

    header{display:flex;justify-content:center;padding:16px 0}
    #logo{max-height:56px;display:none}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}

    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}
    form input,form textarea,form select{width:100%;padding:12px;border-radius:10px;border:0;margin:8px 0;background:#ffffff12;color:#fff}

    .grid{display:grid;gap:18px}

    /* ===== Bloc A : image|vid + formulaire ===== */
    #block-a{max-width:1100px;margin:0 auto}
    #pair-a{display:grid;gap:12px;grid-template-columns:1fr}
    @media(min-width:880px){ #pair-a.two-cols{ grid-template-columns:1fr 1fr; } }

    .media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
    .media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}

    /* ===== Bloc B : texte à gauche + vidéo à droite ===== */
    #argu-grid{display:grid;gap:14px;grid-template-columns:1fr}
    @media(min-width:880px){ #argu-grid.two-cols{ grid-template-columns:1fr 0.9fr; } }

    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
    .hide{display:none}
    .text-center{text-align:center}
    .fun{background:linear-gradient(135deg,#ffffff12,#ffffff08)}
  </style>
</head>
<body>
  <main>
    <header>
      <img id="logo" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vendredi-optin1-sprke%2Flogo-1755865050062?alt=media&token=913a3edb-58c7-44fd-ab5f-27e873dc4a21" alt="Logo" onerror="this.style.display='none'">
    </header>

    <!-- 1) Hero -->
    <section class="hero" id="hero">
      <h1 id="title">test titre</h1>
      <p class="sub" id="subtitle">test sous titre</p>
    </section>

    <!-- 2) Description -->
    <section class="card" id="desc-wrap">
      <div id="desc">test description</div>
    </section>

    <!-- ===== Bloc A : Image/Video (si pas d’image) + Formulaire ===== -->
    <section class="card" id="block-a">
      <div id="pair-a">
        <!-- Média A (image OU vidéo si pas d’image) -->
        <div class="media" id="media-a">
  <img id="img-a" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vendredi-optin1-sprke%2Fpage1-hero-1755865051788?alt=media&token=42eafc8e-fdf5-4bdd-a2ec-e2f55abc11d4" alt="" onerror="this.style.display='none'">
  <!-- La vidéo n'est créée que si nécessaire -->
  <video id="vid-a" controls playsinline class="hide" onerror="this.style.display='none'"></video>
</div>

        <!-- Formulaire -->
        <div id="form-col">
          <div id="timer" class="timer hide"></div>

          <script id="form-fields-json" type="application/json">{"name":true,"firstname":true,"email":true,"phone":true,"address":true}</script>

          <form id="lead-form" data-role="capture">
            <div id="form-visible"></div>

            <input type="hidden" name="userId" value="pOoqftYacXhirXtjxVk60Or09nm2" />
            <input type="hidden" name="pageSlug" value="test-vendredi-optin1-sprke-p1" />
            <input type="hidden" name="slug" value="test-vendredi-optin1-sprke-p1" />
            <input type="hidden" name="type" value="tunnel" />
            <input type="hidden" id="nextUrl-hidden" name="nextUrl" value="" />

            <button type="submit" class="btn" id="cta-btn">test bouton</button>

            <div id="gua" class="hide" style="margin-top:10px"><em>satisfait</em></div>
          </form>

          <!-- Remplacement si cta.action = paiement|lien -->
          <a id="cta-link" class="btn hide" href="#" rel="nofollow noopener">test bouton</a>
        </div>
      </div>
    </section>

    <!-- ===== Bloc B : Texte à gauche + Vidéo à droite ===== -->
    <section class="card" id="block-b">
      <div id="argu-grid">
        <div id="argu-left">
          <div id="prob">test probleme</div>
          <div id="sol">test solution</div>
          <div id="ben">2, 3, 1test benef</div>
          <div id="bul">test point clé, 1, 2, 3</div>
        </div>
        <div class="media" id="argu-video">
          <video id="vid-b" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-vendredi-optin1-sprke%2Fpage1-video-1755865052865?alt=media&token=36719e65-e7ab-40ad-a4e0-865fb344c24c" controls playsinline onerror="this.style.display='none'"></video>
          <iframe id="emb-b" src="" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- Témoignages + FAQ -->
    <section class="card hide" id="testi">
      <h3>Témoignages</h3>
      <div><div class="testimonial-item">témoignage test</div></div>
    </section>

    <section class="card hide" id="faq">
      <h3>FAQ</h3>
      <div><div class="faq-item"><strong>FAQ test</strong><br/></div></div>
    </section>

    <!-- Bonus / Téléchargement -->
    <section class="card hide" id="bonus">
      <h3>Bonus</h3>
      <p id="bonus-desc">Votre ressource est prête.</p>
      <a id="bonus-link" class="btn" href="#" download>Télécharger</a>
    </section>
  </main>

  <!-- Firebase + capture -->
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/firebase-init.js"></script>
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/save-lead-tunnel.js"></script>

  <script>
    (function(){
      const kill = (s)=> (s||'').replace(/```html?/gi,'').replace(/```/g,'');
      ['desc','prob','sol','ben','bul','testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        el.innerHTML = kill(el.innerHTML||'');
      });
    })();

    const cleanText = (s) => (s||"").toString().replace(/^['"\\s]+|['"\\s]+$/g,'').trim();
    const isHttp = (u)=>{ try{ const x=new URL(u); return x.protocol==='http:'||x.protocol==='https:'; }catch(e){ return false; } };

    (function(){
  const v=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (!v || v==='{{ui.mainColor}}'){
    document.documentElement.style.setProperty('--bg', '{{ui.mainColor}}'.trim() || '#111');
  }
})();

    (function(){
      const logo=document.getElementById('logo');
      if (logo && cleanText(logo.getAttribute('src'))) logo.style.display='block';

      const title=document.getElementById('title');
      const subtitle=document.getElementById('subtitle');
      const desc=document.getElementById('desc');
      if (!cleanText(title.textContent) && !cleanText(subtitle.textContent)) document.getElementById('hero').style.display='none';
      if (!cleanText(subtitle.textContent)) subtitle.style.display='none';
      if (!cleanText(desc.textContent)) document.getElementById('desc-wrap').style.display='none';
    })();

    (function(){
      const host = document.getElementById('form-visible');
      const raw  = document.getElementById('form-fields-json')?.textContent || '[]';

      function input(type, name, placeholder, required=true, options=null){
        const req = required ? 'required' : '';
        if (type==='textarea') return `<textarea name="${name}" placeholder="${placeholder}" ${req}></textarea>`;
        if (type==='select' && Array.isArray(options)){
          const opts=options.map(o=>`<option value="${(o.value??o)}">${(o.label??o)}</option>`).join('');
          return `<select name="${name}" ${req}>${opts}</select>`;
        }
        return `<input name="${name}" type="${type}" placeholder="${placeholder}" ${req}/>`;
      }
      function fromArray(arr){
        if (!Array.isArray(arr)) return '';
        return arr.map(f=>{
          const t=(f.type||'text').toLowerCase(), n=f.name||'field', ph=f.placeholder||f.label||n;
          return input(t,n,ph,!!f.required,Array.isArray(f.options)?f.options:null);
        }).join('');
      }
      function fromObject(obj){
        const order=['firstname','name','email','phone','address'];
        const keys=order.filter(k=>obj[k]).concat(Object.keys(obj).filter(k=>!order.includes(k) && obj[k]));
        if (keys.length===0) return '';
        return keys.map(k=>{
          const key=k.toLowerCase();
          if (key==='email') return input('email','email','Votre email');
          if (key==='phone') return input('tel','phone','Votre téléphone');
          if (key==='address') return input('textarea','address','Votre adresse');
          if (key==='firstname') return input('text','firstname','Votre prénom');
          if (key==='name'||key==='lastname') return input('text','name','Votre nom');
          return input('text',key,key);
        }).join('');
      }
      function fromString(str){
        const parts=(str||'').split(',').map(s=>s.trim()).filter(Boolean);
        if (!parts.length) return '';
        return fromObject(Object.fromEntries(parts.map(p=>[p,true])));
      }

      let fields; try{ fields=JSON.parse(raw); }catch(e){ fields=raw; }
      let html='';
      if (Array.isArray(fields)) html=fromArray(fields);
      else if (fields && typeof fields==='object') html=fromObject(fields);
      else if (typeof fields==='string') html=fromString(fields);

      if (!html) html=input('email','email','Votre email');
      host.innerHTML=html;
    })();

    (function(){
      const mediaA   = document.getElementById('media-a');
      const imgA     = document.getElementById('img-a');
      const vidA     = document.getElementById('vid-a');
      const pairA    = document.getElementById('pair-a');

      const vidB     = document.getElementById('vid-b');
      const embB     = document.getElementById('emb-b');
      const arguGrid = document.getElementById('argu-grid');
      const arguWrap = document.getElementById('argu-video');

      const imgUrl   = cleanText(imgA.getAttribute('src'));
      const vidUrl   = cleanText(vidB.getAttribute('src'));
      const embUrl   = cleanText(embB.getAttribute('src'));

      const hasImg = isHttp(imgUrl);
      const hasVidB = isHttp(vidUrl);
      const hasEmbB = isHttp(embUrl);

      if (!hasVidB && hasEmbB){ embB.classList.remove('hide'); }

      if (!hasImg && (hasVidB || hasEmbB)){
        const src = hasVidB ? vidUrl : embUrl;
        if (hasVidB){
          vidA.src = src;
          vidA.classList.remove('hide');
        }
        mediaA.querySelector('img')?.setAttribute('style','display:none');
      }
if (!vidA.src) {
  vidA.style.display = 'none';
  vidA.classList.add('hide');
}

      const hasMediaA = (hasImg || !vidA.classList.contains('hide'));
      if (hasMediaA){ pairA.classList.add('two-cols'); } else { pairA.classList.remove('two-cols'); mediaA.style.display='none'; }

      const hasMediaB = hasVidB || hasEmbB;
      if (hasMediaB){ arguGrid.classList.add('two-cols'); }
      else { arguGrid.classList.remove('two-cols'); arguWrap.style.display='none'; }
    })();

    (function(){
      const ctaAction = cleanText('').toLowerCase(); // '', 'capture', 'paiement', 'lien'
      const ctaLink   = cleanText('');
      const ns1 = cleanText('');
      const ns2 = cleanText('.html');
      const ns3 = cleanText('');
      const ns4 = cleanText('');

      let nextHref = ns1 || ns2 || '';
      if (nextHref === '.html') nextHref = '';
      if (!nextHref){
        const slug = ns3 || ns4;
        if (slug) nextHref = slug.endsWith('.html') ? slug : (slug + '.html');
      }

      const hidden = document.getElementById('nextUrl-hidden');
      if (hidden) hidden.value = nextHref || '';

      const form = document.getElementById('lead-form');
      const link = document.getElementById('cta-link');

      if (ctaAction === 'paiement' || ctaAction === 'lien'){
        form.classList.add('hide');
        link.classList.remove('hide');
        link.href = (ctaAction==='paiement' && isHttp(ctaLink)) ? ctaLink : (nextHref || '#');
      } else {
        form.classList.remove('hide');
        link.classList.add('hide');
      }
    })();

    (function(){
      const gua = document.getElementById('gua');
      if (gua && cleanText(gua.textContent)) gua.classList.remove('hide');

      ['testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        const inner=el.querySelector('div'); const txt=cleanText(inner? inner.textContent: '');
        if (txt) el.classList.remove('hide');
      });

      const evergreen = parseInt('30',10)||0;
      const deadlineISO = cleanText('');
      const t = document.getElementById('timer');
      function render(sec){ if(sec<=0){ t.textContent='Offre expirée'; return; } const m=Math.floor(sec/60), s=sec%60; t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s'; }
      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      if(total>0){ t.classList.remove('hide'); (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })(); }
    })();

    (function(){
      const mode = cleanText('none').toLowerCase(); // "direct" | "aucun" | ""
      const url  = cleanText('') || cleanText('') || cleanText('');
      const file = cleanText('') || cleanText('') || cleanText('');
      const href = isHttp(url) ? url : (isHttp(file) ? file : '');

      const wrap = document.getElementById('bonus');
      const link = document.getElementById('bonus-link');

      if (mode==='direct' && href){
        link.href = href;
        wrap.classList.remove('hide');
      }
    })();

    (function(){
      const fb=''.trim();
      if (fb){
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;
          n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src='https://connect.facebook.net/en_US/fbevents.js';
          s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script');
        fbq('init', fb); fbq('track','PageView');
      }
      const gtm=''.trim();
      if (gtm){
        var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtm.js?id='+encodeURIComponent(gtm);
        document.head.appendChild(s);
      }
    })();
  </script>
</body>
</html>
