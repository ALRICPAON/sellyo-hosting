<!DOCTYPE html>

  <style>
    body {
      background-color: #11053b;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      margin-top: 20px;
    }
    h1, p {

      margin: 20px auto;
      max-width: 600px;
    }
    .row {

      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;

    }
    .column {
      flex: 1;

      padding: 20px;

      flex-direction: column;
      gap: 10px;

      margin: auto;
    }
    input, select {

      border: none;

      border-radius: 8px;
      background: #371a94;
      color: white;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 10px rgba(0,204,255,0.5);
    }
    video {
      max-width: 100%;
      display: block;
      margin: 30px auto;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
    }
    footer a {
      color: #aaa;
    }
