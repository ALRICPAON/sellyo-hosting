  <script src="https://js.stripe.com/v3"></script>

  <!-- CTA paiement + redirection (identique philosophie sales) -->
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const btn  = document.getElementById('payBtn');

    // === Champs mappés UNIQUEMENT depuis webhook 1.* ===
    const paymentLink = "https://buy.stripe.com/test_aFa4gs1EO5jHbCe8aM6kg00".trim();                  // ex: https://buy.stripe.com/...
    const pubKey      = "".trim();         // ex: pk_test_...
    const priceId     = "".trim();                // ex: price_...
    const next        = "test-paye-qzat3-p2.html".trim();                        // ex: mardi3-l3tb2-p4.html
    const url         = "".trim();
    const mode        = ("checkout" || "payment").trim();            // "payment" | "next" | "url"

    // Prix: masque si non renseigné
    const priceEl  = document.getElementById('price');
    const priceTxt = (priceEl?.textContent || '').trim();
    if (!priceTxt || priceTxt === "{{payment.price}} {{payment.currency}}") {
      priceEl.style.display = 'none';
    }

    // Helper URL absolue pour la redirection de succès
    function abs(href) {
      try { return new URL(href, location.href).href; } catch(_) { return ""; }
    }
    const successUrl = abs(next || "");

    // === Priorité 1: Stripe Checkout dynamique (si priceId + pubKey) ===
    if (mode === 'payment' && pubKey && priceId) {
      btn.style.display = 'block';
      btn.onclick = async (e) => {
        e.preventDefault();
        // Stripe.js client-only Checkout → successUrl dynamique vers la page "merci"
        const stripe = Stripe(pubKey);
        // IMPORTANT: successUrl/cancelUrl DOIVENT être absolues
        const cancelUrl = abs(location.href);
        // Redirection sans créer de session backend (MVP)
        const { error } = await stripe.redirectToCheckout({
          lineItems: [{ price: priceId, quantity: 1 }],
          mode: 'payment',
          successUrl: successUrl || cancelUrl,
          cancelUrl
        });
        if (error) {
          console.error('[checkout] Stripe error:', error);
          // Fallback éventuel
          if (paymentLink) location.href = paymentLink;
        }
      };
    }

    // === Priorité 2: Payment Link (si fourni et pas de priceId/pubKey) ===
    else if (mode === 'payment' && paymentLink) {
      btn.style.display = 'block';
      btn.onclick = (e) => { e.preventDefault(); location.href = paymentLink; };

      // Fallback auto: si l'utilisateur revient de stripe.com et qu'on a une "next"
      try {
        const qs = new URLSearchParams(location.search);
        if ((qs.get('paid') === '1' || document.referrer.includes('stripe.com')) && next) {
          // ⚠️ Ce fallback ne marche que si le Payment Link a été configuré pour revenir ici.
          location.replace(successUrl);
        }
      } catch(_) {}
    }

    // === Priorité 3: autres modes (next/url/download) ===
    else if (mode === 'next' && next) {
      btn.style.display = 'block';
      btn.onclick = (e) => { e.preventDefault(); location.href = successUrl; };
    } else if (mode === 'url' && url) {
      btn.style.display = 'block';
      btn.onclick = (e) => { e.preventDefault(); location.href = url; };
    } else {
      const dl = "https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-paye-qzat3%2Fdelivery-product-1756829594487?alt=media&token=2d045118-00b3-49ca-a554-83c6a4da2a05".trim();
      if (dl) {
        btn.style.display = 'block';
        btn.onclick = (e) => { e.preventDefault(); location.href = dl; };
      } else {
        btn.style.display = 'none';
      }
    }
  });
</script>

  <!-- Timer (evergreen ou deadline ISO) -->
  <script>
    (function(){
      const clean = (s)=> (s||"").toString().trim();
      const t = document.getElementById('timer');
      if(!t) return;

      const evergreen = parseInt('',10) || 0;
      const deadlineISO = clean('');

      function render(sec){
        if(sec<=0){ t.textContent='Offre expirée'; return; }
        const m=Math.floor(sec/60), s=sec%60;
        t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s';
      }

      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) {
        total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      }

      if(total>0){
        t.style.display='block';
        (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })();
      }
    })();
  </script>
