<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>optin096</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{ --bg: #8d8600; --btn: #f2f7b7; --text:#fff }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:24px}

    header{display:flex;justify-content:center;align-items:center;padding:16px 0}
    #logo{max-height:56px;display:none}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}
    form input,form textarea,form select{width:100%;padding:12px;border-radius:10px;border:0;margin:8px 0;background:#ffffff12;color:#fff}

    #pair-a{display:grid;gap:18px;grid-template-columns:1fr}
    @media(min-width:880px){ #pair-a.two-cols{ grid-template-columns:1fr 1fr; } }
    #pair-a.center .media-a{display:none}
    #pair-a.center #form-col{max-width:480px;margin:0 auto}

    .media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
    .media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}

    #argu-grid{display:grid;gap:18px;grid-template-columns:1fr}
    @media(min-width:880px){ #argu-grid.two-cols{ grid-template-columns:1fr 0.95fr; align-items:start } }
    #argu-grid.center video,#argu-grid.center iframe{max-width:720px;margin:0 auto;display:block}

    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
    .hide{display:none}
    .muted{opacity:.85}
  </style>
</head>
<body>
  <main>
    <header>
      <img id="logo" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Foptin096-o5nt6%2Flogo-1757671378890?alt=media&token=41223140-bc8b-40e4-adb0-f58b2309a34c" alt="Logo" onerror="this.style.display='none'">
    </header>

    <!-- 1) Hero -->
    <section class="hero" id="hero">
      <h1 id="title">titre</h1>
      <p class="sub" id="subtitle">soustitre</p>
    </section>

    <!-- 2) Description -->
    <section class="card" id="desc-wrap">
      <div id="desc">description</div>
      <div id="gua" class="muted" style="margin-top:10px"><em data-alt="garantie">garantie</em></div>
    </section>

    <!-- Bloc A : Média (gauche) + Formulaire (droite) -->
    <section class="card" id="block-a">
      <div id="pair-a">
        <!-- Média A -->
        <div class="media media-a" id="media-a">
          <img id="img-a" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Foptin096-o5nt6%2Fpage1-hero-1757671379612?alt=media&token=de90527a-946c-425d-8fbd-19f2c473514b" alt="" loading="eager" decoding="async" onerror="this.style.display='none'">
          <video id="vid-a" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Foptin096-o5nt6%2Fpage1-video-1757671380831?alt=media&token=f7d8eb23-72bb-4064-a1ba-a0ae2dc413af" controls playsinline class="hide" onerror="this.style.display='none'"></video>
          <iframe id="emb-a" src="" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- Formulaire -->
        <div id="form-col">
          <div id="timer" class="timer hide"></div>

          <script id="form-selected-json" type="application/json"></script>
          <script id="form-selected-csv" type="application/json"></script>
          <script id="form-fields-json" type="application/json">{"name":false,"firstname":true,"email":true,"phone":true,"address":false}</script>

          <form id="lead-form" data-role="capture" data-next="optin096-o5nt6-p2.html">
            <div id="form-visible"></div>

            <!-- Hiddens requis -->
            <input type="hidden" name="userId" id="userId" value="" />
            <input type="hidden" name="pageSlug" value="optin096-o5nt6-p1" />
            <input type="hidden" name="slug" value="optin096-o5nt6-p1" />
            <input type="hidden" name="type" value="tunnel" />
            <input type="hidden" id="nextUrl-hidden" name="nextUrl" value="" />

            <button type="submit" class="btn" id="cta-btn">je test</button>
            <div class="muted" style="font-size:12px"></div>
          </form>

          <!-- Remplacement si cta.action = paiement|lien -->
          <a id="cta-link" class="btn hide" href="#" rel="nofollow noopener">je test</a>
        </div>
      </div>
    </section>

    <!-- Bloc B : Texte (gauche) + Vidéo (droite) -->
    <section class="card hide" id="block-b">
      <div id="argu-grid">
        <div id="argu-left">
          <div id="prob" data-alt="prob">prob</div>
          <div id="sol" data-alt="solution">solu</div>
          <div id="ben" data-alt="benefits">benef</div>
          <div id="bul" data-alt="bullets">clé</div>
        </div>
        <div class="media" id="argu-video">
          <video id="vid-b" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Foptin096-o5nt6%2Fpage1-video-1757671380831?alt=media&token=f7d8eb23-72bb-4064-a1ba-a0ae2dc413af" controls playsinline class="hide" onerror="this.style.display='none'"></video>
          <iframe id="emb-b" src="" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- Témoignages + FAQ -->
    <section class="card hide" id="testi">
      <h3>Témoignages</h3>
      <div id="testi-body" data-alt="temoin"></div>
    </section>
    <section class="card hide" id="faq">
      <h3>FAQ</h3>
      <div id="faq-body" data-alt="faq"></div>
    </section>
  </main>

  <!-- Firebase + capture (MODULES comme dans l’ancien tin qui marchait) -->
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/firebase-init.js"></script>
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/save-lead-tunnel.js"></script>

  <script>
    const t = (s)=> (s||"").toString();
    const clean = (s)=> t(s).trim();
    const isToken = (s)=> /\{\{[^}]+\}\}/.test(t(s));
    const isHttp = (u)=>{ try{ const x=new URL(clean(u)); return x.protocol==='http:'||x.protocol==='https:'; }catch(_){ return false; } };

    (function(){
      const uid = document.getElementById('userId');
      if (uid && !clean(uid.value)) {
        const m = location.pathname.match(/\/tunnels\/([^/]+)/);
        if (m && m[1]) uid.value = m[1];
      }
      const next = document.getElementById('nextUrl-hidden');
      const dataNext = clean(document.getElementById('lead-form')?.getAttribute('data-next'));
      if (next && !clean(next.value)) next.value = dataNext;
      if (next && next.value && !/^https?:\/\//i.test(next.value)) {
        try { next.value = new URL(next.value, location.href.replace(/[^/]*$/,'')).toString(); } catch(_){}
      }
    })();

    (function(){
      const logo=document.getElementById('logo');
      const src=clean(logo?.getAttribute('src'));
      if (logo && src && !isToken(src) && (/^(https?:|data:image)/i.test(src))) logo.style.display='block';
    })();

    (function(){
      const wrap=document.getElementById('gua'); if(!wrap) return;
      const em=wrap.querySelector('em'); if(!em) return;
      const txt=clean(em.textContent); const alt=clean(em.getAttribute('data-alt'));
      const final = (!txt || isToken(txt)) ? (isToken(alt)? '' : alt) : txt;
      if (!final) wrap.style.display='none'; else em.textContent=final;
    })();

    (function(){
  const host = document.getElementById('form-visible');
  const tok  = v => /\{\{[^}]+\}\}/.test((v||'')+'');
  if(!host) return;

  let cfg = {};
  try{
    const el  = document.getElementById('form-fields-json');
    const raw = (el?.textContent || '').trim();
    if (raw && !tok(raw)) cfg = JSON.parse(raw);
  }catch(_){}

  if (cfg && typeof cfg==='object' && cfg.formFields && typeof cfg.formFields==='object'){
    cfg = cfg.formFields;
  }

  let selected = [];
  if (cfg && typeof cfg==='object' && !Array.isArray(cfg)){
    selected = Object.entries(cfg)
      .filter(([,v]) => v===true || v==='true' || v===1 || v==='1')
      .map(([k]) => k);
  }

  if (!selected.length){
    let selJson = '';
    if (selJson && !tok(selJson) && selJson.trim()){
      try { const arr=JSON.parse(selJson); if(Array.isArray(arr)) selected = arr; } catch(_){}
    }
  }
  if (!selected.length){
    let selCsv = '';
    if (selCsv && !tok(selCsv) && selCsv.trim()){
      selected = selCsv.split(',').map(s=>s.trim()).filter(Boolean);
    }
  }

  const norm = (k)=>{
    const x = (k||'').toString().toLowerCase();
    if (x==='firstname' || x==='first_name' || x==='prenom' ) return 'firstName';
    if (x==='lastname'  || x==='last_name'  || x==='name' || x==='nom') return 'lastName';
    if (x==='email' || x==='e-mail') return 'email';
    if (x==='phone' || x==='tel' || x==='telephone') return 'phone';
    if (x==='address' || x==='adresse') return 'address';
    return null;
  };
  selected = selected.map(norm).filter(Boolean);

  if (!selected.length) selected = ['email'];

  const fields = {
    firstName: `<input name="firstName" id="firstName" placeholder="Prénom" autocomplete="given-name">`,
    lastName:  `<input name="lastName"  id="lastName"  placeholder="Nom" autocomplete="family-name">`,
    email:     `<input type="email" name="email" id="email" placeholder="Email" autocomplete="email" required>`,
    phone:     `<input type="tel" name="phone" id="phone" placeholder="Téléphone" inputmode="tel" autocomplete="tel">`,
    address:   `<textarea name="address" id="address" placeholder="Adresse"></textarea>`
  };
  host.innerHTML = selected.map(k => fields[k] || '').join('');
})();

    (function(){
      const pairA = document.getElementById('pair-a');
      const blockB= document.getElementById('block-b');
      const argu  = document.getElementById('argu-grid');

      const imgA  = document.getElementById('img-a');
      const vidA  = document.getElementById('vid-a');
      const embA  = document.getElementById('emb-a');
      const vidB  = document.getElementById('vid-b');
      const embB  = document.getElementById('emb-b');

      function applyLayout(){
        const hasImg = isHttp(imgA?.getAttribute('src')||'') && imgA.style.display!=='none';
        const hasVid = isHttp(vidA?.getAttribute('src')||'') || isHttp(vidB?.getAttribute('src')||'');
        const hasEmb = (!!clean(embA?.getAttribute('src')) && !isToken(embA?.getAttribute('src'))) ||
                       (!!clean(embB?.getAttribute('src')) && !isToken(embB?.getAttribute('src')));
        const anyVideo = hasVid || hasEmb;

        [vidA,embA,vidB,embB].forEach(el=>{ if(!el) return; el.classList.add('hide'); el.style.display='none'; });
        blockB.classList.add('hide');
        argu.classList.remove('two-cols','center');

        if (!hasImg && !anyVideo){
          pairA.classList.remove('two-cols'); pairA.classList.add('center'); return;
        }
        if (hasImg && anyVideo){
          pairA.classList.remove('center'); pairA.classList.add('two-cols');
          imgA.style.display='block'; blockB.classList.remove('hide');
          let mediaB=false;
          if (isHttp(vidB?.getAttribute('src')||'')){ vidB.classList.remove('hide'); vidB.style.display='block'; mediaB=true; }
          else if (isHttp(vidA?.getAttribute('src')||'')){ vidB.src=vidA.src; vidB.classList.remove('hide'); vidB.style.display='block'; mediaB=true; }
          else if (clean(embB?.getAttribute('src'))){ embB.classList.remove('hide'); embB.style.display='block'; mediaB=true; }
          else if (clean(embA?.getAttribute('src'))){ embB.src=embA.src; embB.classList.remove('hide'); embB.style.display='block'; mediaB=true; }
          const hasText = ['prob','sol','ben','bul'].some(id=> clean(document.getElementById(id)?.textContent));
          argu.classList.add(mediaB && hasText ? 'two-cols' : 'center');
          return;
        }
        if (hasImg && !anyVideo){
          pairA.classList.remove('center'); pairA.classList.add('two-cols');
          imgA.style.display='block'; return;
        }
        if (!hasImg && anyVideo){
          pairA.classList.remove('center'); pairA.classList.add('two-cols');
          if (isHttp(vidA?.getAttribute('src')||'')) { vidA.classList.remove('hide'); vidA.style.display='block'; }
          else if (clean(embA?.getAttribute('src'))) { embA.classList.remove('hide'); embA.style.display='block'; }
        }
      }

      document.addEventListener('DOMContentLoaded', applyLayout);
      if (imgA && imgA.decode) { imgA.decode().then(()=>applyLayout()).catch(()=>applyLayout()); }
      imgA && imgA.addEventListener('load', applyLayout);
      imgA && imgA.addEventListener('error', applyLayout);
      setTimeout(applyLayout, 600);
    })();

    (function(){
      const ns1 = clean('');
      const ns2 = clean('optin096-o5nt6-p2.html');
      const ns3 = clean('');
      const ns4 = clean('optin096-o5nt6-p2');
      let nextHref = ns1 || ns2 || '';
      if (!nextHref){
        const slug = ns3 || ns4;
        if (slug) nextHref = slug.endsWith('.html') ? slug : (slug + '.html');
      }
      const hidden = document.getElementById('nextUrl-hidden'); if (hidden) hidden.value = nextHref || '';
      const form = document.getElementById('lead-form');
      const link = document.getElementById('cta-link');

      const action = clean('next').toLowerCase();
      const mode = (action==='checkout') ? 'payment' : (action||'');
      const payLink = clean('') || clean('');
      if (mode==='payment' || mode==='url'){
        form.classList.add('hide'); link.classList.remove('hide');
        link.href = (mode==='payment' && isHttp(payLink)) ? payLink : (nextHref||'#');
      } else {
        form.classList.remove('hide'); link.classList.add('hide');
      }
    })();

    (function(){
      function showFromRaw(wrapId, bodyId, mapJson){
        const wrap=document.getElementById(wrapId), body=document.getElementById(bodyId);
        if(!wrap||!body) return;
        let raw=clean(body.textContent);
        if(!raw || isToken(raw)) raw = clean(body.getAttribute('data-alt'));
        if(!raw || isToken(raw)) return;
        let html='';
        try{ const data=JSON.parse(raw); html = mapJson(data); }catch(_){ html = raw; }
        if(html){ body.innerHTML=html; wrap.classList.remove('hide'); }
      }
      showFromRaw('testi','testi-body', arr => Array.isArray(arr)?arr.map(t=>`<div class="testimonial-item">“${clean(t?.text||t)}”</div>`).join(''):'');
      showFromRaw('faq','faq-body',   arr => Array.isArray(arr)?arr.map(x=>`<div class="faq-item"><strong>${clean(x?.q||x?.question||'')}</strong><br/>${clean(x?.a||x?.answer||'')}</div>`).join(''):'');
    })();

    (function(){
      const tEl=document.getElementById('timer');
      const evergreen = parseInt('30',10)||0;
      const deadline  = clean('');
      function activate(endTs){
        tEl.classList.remove('hide');
        function tick(){
          const now=Date.now(), diff=Math.max(0,endTs-now);
          const m=Math.floor(diff/60000), s=Math.floor((diff%60000)/1000);
          tEl.textContent = `Offre expire dans ${m}m ${String(s).padStart(2,'0')}s`;
          if(diff<=0) clearInterval(iv);
        }
        tick(); const iv=setInterval(tick,1000);
      }
      if(evergreen>0) activate(Date.now()+evergreen*60*1000);
      else if(deadline && !isToken(deadline)){ const ts=Date.parse(deadline); if(!Number.isNaN(ts)) activate(ts); }
    })();
  </script>
</body>
</html>
