<!-- alias of sales.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>{{133.seo.metaTitle}}</title>
  <meta name="description" content="{{133.seo.metaDescription}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0b1220; --btn:#3b82f6; }
    body { margin:0; background:var(--bg); color:#fff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:24px; }
    header { display:flex; justify-content:center; padding:16px 0; }
    header img { max-height:56px; display:block; }
    .media img, .media video { max-width:80%; max-height:340px; display:block; margin:18px auto; border-radius:12px; }
    h1 { font-size:clamp(26px,3.3vw,40px); margin:8px 0 6px; text-align:center; }
    p.sub { opacity:.85; text-align:center; margin:0 0 16px; }
    .grid { display:grid; gap:18px; grid-template-columns:1fr; }
    @media(min-width:900px){ .grid { grid-template-columns:1.1fr .9fr; } }
    .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:18px; }
    .btn-primary { background:var(--btn); color:#fff; font-weight:700; border:0; border-radius:12px; padding:12px 18px; cursor:pointer; text-decoration:none; display:inline-block; }
    ul { margin:10px 0; padding-left:22px; }
  </style>
</head>
<body>
  <header><img src="{{133.logoUrl}}" alt="" /></header>

  <main>
    <div class="media">
      <video src="{{133.media.videoMp4}}" controls></video>
      <img src="{{133.media.imageUrl}}" alt="" />
    </div>

    <h1>{{133.title}}</h1>
    <p class="sub">{{133.subtitle}}</p>

    <div class="grid">
      <section class="card">
        <div>{{133.productDescription}}</div>
        <div>{{133.copy.bullets}}</div>
        <div>{{133.copy.benefits}}</div>
        <div>{{133.copy.guarantee}}</div>
      </section>

      <aside class="card" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
        <a href="{{1.payment.paymentLink}}" class="btn-primary">{{133.ctaText}}</a>
      </aside>
    </div>
  </main>

  <script>
    (function(){
      var v=document.querySelector(".media video");
      var i=document.querySelector(".media img");
      if(v && (!v.src||v.getAttribute("src")==="")) v.style.display="none";
      if(i && (!i.src||i.getAttribute("src")==="")) i.style.display="none";
    })();
  </script>
</body>
</html>
