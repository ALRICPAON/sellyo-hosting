<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>{{seo.metaTitle}}</title>
  <meta name="description" content="{{seo.metaDescription}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{ --bg:#0b1220; --btn: {{ui.buttonColor}}; --text:#fff }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:1000px;margin:0 auto;padding:24px}
    header{display:flex;justify-content:center;padding:16px 0}
    header img{max-height:56px}
    .media video,.media img{width:100%;max-height:460px;border-radius:14px;display:block}
    .grid{display:grid;gap:18px;grid-template-columns:1fr} @media(min-width:960px){.grid{grid-template-columns:1.2fr .8fr}}
    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    h1{font-size:clamp(28px,3.4vw,42px);margin:10px 0} .sub{opacity:.9;margin:0 0 12px}
    .btn{display:inline-block;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-decoration:none}
    .note{opacity:.85;margin-top:8px}
    ul{margin:8px 0 0 18px}
  </style>
</head>
<body>
  <header><img src="{{brand.logoUrl}}" alt="Logo" onerror="this.style.display='none'"></header>
  <main>
    <div class="media">
      <video src="{{media.videoMp4}}" controls playsinline onerror="this.style.display='none'"></video>
      <img src="{{media.imageUrl}}" alt="" onerror="this.style.display='none'">
    </div>
    <h1>{{copy.title}}</h1>
    <p class="sub">{{copy.subtitle}}</p>

    <div class="grid">
      <section class="card">
        <div id="desc">{{copy.productDescription}}</div>
        <ul id="bul">{{copy.bullets}}</ul>
        <div id="ben">{{copy.benefits}}</div>
        <div id="gua" class="note"><em>{{copy.guarantee}}</em></div>
      </section>
      <aside class="card" style="display:flex;gap:12px;flex-direction:column">
        <a class="btn" href="{{payment.paymentLink}}">{{copy.ctaText}}</a>
        <a class="btn" style="background:#ffffff22" href="{{flow.nextHref}}">Non merci</a>
      </aside>
    </div>
  </main>
  <script>
    (function(){['desc','bul','ben','gua'].forEach(id=>{const el=document.getElementById(id);if(!el)return; if(!(el.textContent||'').trim()) el.style.display='none';});})();
  </script>
</body>
</html>
