 <!-- Gestion dynamique du CTA (robuste) -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.querySelector("button.cta");
    if (!btn) return;

    const clean   = (s)=> (s||"").toString().trim();
    const isToken = (s)=> /\{\{[^}]+\}\}/.test(s||"");
    const withSlash = (u)=> u ? (u.endsWith('/') ? u : (u + '/')) : "";

    // === Données (1.* = global webhook) ===
    const pk       = clean("pk_test_51RVsTD4PUVU3ejcHlK1AAkobBcOKPp3k0l9AHMmq68d7OdSDjyVKLtA9XpMGqiUIeIgtMvhSTUDrMl9rPityqi5u002UMlmdET");
    const priceId  = clean("price_1Rx31U4PUVU3ejcHtRO3U55v");
    const payLink  = clean("");
    const baseUrl0 = clean("https://alricpaon.github.io/sellyo-hosting/tunnels/pOoqftYacXhirXtjxVk60Or09nm2");
    const baseUrl  = withSlash(baseUrl0);

    // Cibles de navigation (merci / suite)
    const nextSlug = clean("jeudi6-aicz6-p2");
    const rawNext  = clean("jeudi6-aicz6-p2.html");
    const nextHref = (!isToken(rawNext) && rawNext) || (nextSlug ? (nextSlug + ".html") : "");

    // URL directe et download (si jamais)
    const url      = clean("");
    const download = clean("https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fjeudi6-aicz6%2Fdelivery-product-1756983329478?alt=media&token=e7bb404d-517d-4fe7-9579-950d53da2153");

    // Mode (par défaut, payment)
    let rawMode = "checkout";
    let mode = (!rawMode || isToken(rawMode)) ? "payment" : clean(rawMode).toLowerCase();
    if (mode === "checkout") mode = "payment";

    // --- Priorité: Stripe Checkout (pk+priceId+nextHref) > Payment Link > next > url > download ---
    if (mode === "payment" && pk && priceId && nextHref) {
      // Stripe Checkout client-only (redirection auto vers la page merci)
      const stripe = Stripe(pk);
      btn.onclick = async (e) => {
        e.preventDefault();
        const successUrl = baseUrl + nextHref;   // doit être ABSOLU
        const cancelUrl  = window.location.href;
        const { error } = await stripe.redirectToCheckout({
          lineItems: [{ price: priceId, quantity: 1 }],
          mode: "payment",
          successUrl,
          cancelUrl
        });
        if (error) console.warn("Stripe error:", error.message);
      };
      return;
    }

    if (mode === "payment" && payLink && !isToken(payLink)) {
      // Fallback: Payment Link
      btn.onclick = (e) => { e.preventDefault(); window.location.href = payLink; };
      return;
    }

    if (mode === "next" && nextHref) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = nextHref; };
      return;
    }

    if (mode === "url" && url && !isToken(url)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = url; };
      return;
    }

    if (download && !isToken(download)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = download; };
      return;
    }

    // Sinon, on cache le bouton
    btn.style.display = "none";
  });
</script>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  const val = (s)=> (s||"").toString().trim();
  const isToken = (s)=> /\{\{[^}]+\}\}/.test(s||"");
  const isImgLike = (u)=> /^(https?:|data:image)/i.test(u||""); // tolère http/https + data:

  const vidSrc = val("https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fjeudi6-aicz6%2Fpage1-video-1756983331650?alt=media&token=eb0bbd63-0acf-4248-bd94-d05bbae20edc");
  const imgSrc = val("https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fjeudi6-aicz6%2Fpage1-hero-1756983330556?alt=media&token=7b631a91-d836-4fd3-8846-f5221325b59a");

  const wrap   = document.getElementById('media');
  const img    = document.getElementById('media-img');
  const video  = document.getElementById('media-video');
  const source = document.getElementById('media-video-src');

  if (!wrap) return;

  const hasVid = !!vidSrc && !isToken(vidSrc);
  const hasImg = !!imgSrc && !isToken(imgSrc) && isImgLike(imgSrc);

  if (hasVid) {
    if (source) source.src = vidSrc;
    if (video) { video.classList.remove('hide'); video.style.display = 'block'; video.load(); }
    if (img)   { img.classList.add('hide'); img.style.display = 'none'; }
    wrap.style.display = 'flex';
  } else if (hasImg) {
    if (img)   { img.src = imgSrc; img.classList.remove('hide'); img.style.display = 'block'; }
    if (video) { video.classList.add('hide'); video.style.display = 'none'; }
    wrap.style.display = 'flex';
  } else {
    wrap.style.display = 'none';
  }
});
</script>


  <!-- Timer (evergreen ou deadline ISO) -->
  <script>
    (function(){
      const clean = (s)=> (s||"").toString().trim();
      const t = document.getElementById('timer');
      if(!t) return;

      const evergreen = parseInt('',10) || 0;
      const deadlineISO = clean('');

      function render(sec){
        if(sec<=0){ t.textContent='Offre expirée'; return; }
        const m=Math.floor(sec/60), s=sec%60;
        t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s';
      }

      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) {
        total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      }

      if(total>0){
        t.style.display='block';
        (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })();
      }
    })();
  </script>
