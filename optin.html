<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Optin</title>
  <style>
    :root{--bg:#0b1220;--btn:#3b82f6;--text:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui, -apple-system, Segoe UI, Roboto}
    main{max-width:860px;margin:40px auto;padding:24px}
    h1{margin:8px 0 6px}
    h2,h3{margin:18px 0 10px}
    header{display:flex;justify-content:center;margin-bottom:16px}
    #logo{max-height:48px;display:none}
    section{margin:18px 0}
    input,button,textarea{width:100%;padding:12px;border:0;border-radius:10px;margin:8px 0}
    button{background:var(--btn);color:#fff;font-weight:700;cursor:pointer}
    small,em{opacity:.8}
    .badges{display:flex;gap:8px;flex-wrap:wrap}
    .badge{background:#ffffff20;padding:6px 10px;border-radius:999px;font-size:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    ul{padding-left:18px}
    video,iframe,img{max-width:100%;border-radius:12px}
    details{background:#ffffff10;padding:12px;border-radius:10px}
    .t-center{text-align:center}
    .muted{opacity:.7}
  </style>
</head>
<body>
<main>
  <header><img id="logo" alt="Logo"></header>

  <h1 data-slot="headline">Titre optin</h1>
  <p class="muted" data-slot="subtitle"></p>

  <section class="t-center" id="media">
    <section id="hero-image" data-optional="image" style="display:none">
      <img id="hero-img" alt="">
    </section>
    <section id="hero-video" data-optional="video" style="display:none">
      <video id="hero-mp4" controls style="display:none"></video>
      <div id="hero-embed" style="aspect-ratio:16/9;display:none"></div>
    </section>
  </section>

  <section class="row">
    <div>
      <h3>Points clés</h3>
      <ul data-slot="bullets"></ul>

      <h3>Bénéfices</h3>
      <ul data-slot="benefits"></ul>

      <p><strong>Garantie :</strong> <em data-slot="guarantee"></em></p>

      <div class="badges" id="badges"></div>
    </div>
    <div>
      <h3>Problème</h3>
      <p data-slot="problem"></p>

      <h3>Solution</h3>
      <p data-slot="solution"></p>
    </div>
  </section>

  <section id="timer-block" style="display:none">
    <h3>Offre se termine dans</h3>
    <p id="countdown" style="font-size:28px;font-weight:800"></p>
    <small class="muted" id="timer-hint"></small>
  </section>

  <section>
    <h3>Témoignages</h3>
    <div id="testimonials"></div>
  </section>

  <section>
    <h3>Questions fréquentes</h3>
    <div id="faqs"></div>
  </section>

  <section>
    <form id="optin-form">
      <input type="hidden" name="userId">
      <input type="hidden" name="slug">
      <input type="hidden" name="type" value="tunnel">
      <input type="hidden" name="nextUrl">
      <!-- Champs dynamiques selon cfg.formFields -->
      <div id="dynamic-fields"></div>
      <button type="submit"><span data-slot="cta">Continuer</span></button>
      <p class="muted t-center"><small>Vos informations sont enregistrées de façon sécurisée.</small></p>
    </form>
  </section>
</main>

<script>
  window.addEventListener('error', e => console.error('[window.onerror]', e.message, e.error || e));
  window.addEventListener('unhandledrejection', e => console.error('[unhandledrejection]', e.reason));
</script>

<script type="module" src="./js/firebase-init.js"></script>
<script type="module" src="./js/save-lead-tunnel.js"></script>
<script type="module">
  import { injectSlots } from "./js/inject-content.js";

  // helpers affichage
  const $ = (s)=>document.querySelector(s);
  const setText = (sel, v)=>{ const el=$(sel); if(el) el.textContent = v || ""; }
  const setBullets = (sel, arr)=>{ const el=$(sel); if(!el) return; el.innerHTML = (arr||[]).map(i=>`<li>${i}</li>`).join(""); }

  function renderBadges(list=[]) {
    const host = document.getElementById("badges");
    if(!host) return;
    host.innerHTML = (list||[]).map(b=>`<span class="badge">${b}</span>`).join("");
  }

  function renderTestimonials(list=[]) {
    const host = document.getElementById("testimonials");
    if(!host) return;
    host.innerHTML = (list||[]).map(t=>`
      <details>
        <summary><strong>${t.name || "Avis"}</strong></summary>
        <p>${t.text || ""}</p>
      </details>
    `).join("") || '<p class="muted">Aucun témoignage pour l’instant.</p>';
  }

  function renderFaqs(list=[]) {
    const host = document.getElementById("faqs");
    if(!host) return;
    host.innerHTML = (list||[]).map(f=>`
      <details>
        <summary>${f.q || "Question"}</summary>
        <p>${f.a || ""}</p>
      </details>
    `).join("") || '<p class="muted">Aucune question fréquente.</p>';
  }

  function startTimer(cfg) {
    const enabled = !!(cfg.components?.timer);
    const evergreen = cfg.timers?.evergreenMinutes ?? null;
    const deadline = cfg.timers?.deadlineISO || null;
    const block = document.getElementById("timer-block");
    if(!enabled || (!evergreen && !deadline)) { if(block) block.style.display="none"; return; }
    block.style.display = "";
    const label = document.getElementById("countdown");
    const hint = document.getElementById("timer-hint");
    let end = null;
    if (deadline) end = new Date(deadline).getTime();
    else end = Date.now() + (Number(evergreen)*60*1000);
    hint.textContent = deadline ? `Fin le ${new Date(end).toLocaleString()}` : `Compteur ${evergreen} minutes`;
    const tick = ()=>{
      const rest = Math.max(0, end - Date.now());
      const s = Math.floor(rest/1000)%60;
      const m = Math.floor(rest/60000)%60;
      const h = Math.floor(rest/3600000);
      label.textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      if(rest<=0) clearInterval(iv);
    };
    tick();
    const iv = setInterval(tick, 1000);
  }

  async function resolveNextUrl(userId, nextSlug){
    if(!nextSlug) return "";
    // essaie de lire le JSON de la page suivante pour déterminer le fichier
    const repo = (location.pathname.split("/")[1] || "");
    const rootPath = repo ? `/${repo}/` : "/";
    const base = `${location.origin}${rootPath}`;
    try {
      const res = await fetch(`${base}tunnels/${encodeURIComponent(userId)}/${encodeURIComponent(nextSlug)}.json`, {cache:"no-store"});
      const cfgNext = res.ok ? await res.json() : null;
      const type = (cfgNext?.pageType || cfgNext?.type || "sales").toLowerCase();
      const map = { optin:"optin", sales:"sales", checkout:"checkout", thankyou:"thankyou", upsell:"sales", downsell:"sales", webinar:"sales" };
      const file = map[type] || "sales";
      return `${file}.html?slug=${encodeURIComponent(nextSlug)}&userId=${encodeURIComponent(userId)}`;
    } catch {
      // fallback sales
      return `sales.html?slug=${encodeURIComponent(nextSlug)}&userId=${encodeURIComponent(userId)}`;
    }
  }

  (async () => {
    const qs = new URLSearchParams(location.search);
    const slug = qs.get("slug");
    const cfg = await injectSlots({ slug, page: "optin" });

    // Texte supplémentaires
    setText('[data-slot="subtitle"]', cfg.subtitle || "");
    setText('[data-slot="problem"]', cfg.copy?.problem || "");
    setText('[data-slot="solution"]', cfg.copy?.solution || "");
    setBullets('[data-slot="benefits"]', Array.isArray(cfg.copy?.benefits) ? cfg.copy.benefits : []);
    setText('[data-slot="guarantee"]', cfg.copy?.guarantee || "");
    renderBadges(cfg.components?.badges || []);
    renderTestimonials(cfg.testimonials || []);
    renderFaqs(cfg.faqs || []);
    startTimer(cfg);

    // Form dynamiques
    const f = document.getElementById("optin-form");
    const host = document.getElementById("dynamic-fields");
    const fields = cfg.formFields || cfg.components?.formFields || { firstname:true, email:true };
    host.innerHTML = `
      ${fields.name ? `<input name="name" placeholder="Nom">` : ``}
      ${fields.firstname ? `<input name="firstname" placeholder="Prénom" required>` : ``}
      ${fields.email ? `<input type="email" name="email" placeholder="Email" required>` : ``}
      ${fields.phone ? `<input name="phone" placeholder="Téléphone">` : ``}
      ${fields.address ? `<input name="address" placeholder="Adresse">` : ``}
    `;
    f.userId.value = cfg.userId;
    f.slug.value = cfg.slug;

    const nextSlug = cfg.flow?.nextSlug || (cfg.slug?.replace(/-p(\d+)$/, (_,n)=>`-p${(+n+1)}`));
    f.nextUrl.value = await resolveNextUrl(cfg.userId, nextSlug);
  })().catch(e => console.error("[optin] inject error", e));
</script>
</body>
</html>
