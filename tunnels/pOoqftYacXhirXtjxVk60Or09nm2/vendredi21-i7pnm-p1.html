 <!-- Gestion dynamique du CTA (robuste) -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.querySelector("button.cta");
    if (!btn) return;

    const clean   = (s)=> (s||"").toString().trim();
    const isToken = (s)=> /\{\{[^}]+\}\}/.test(s||"");
    const withSlash = (u)=> u ? (u.endsWith('/') ? u : (u + '/')) : "";

    const pk       = clean("");
    const priceId  = clean("");
    const payLink  = clean("");
    const baseUrl0 = clean("");                 
    const baseUrl  = withSlash(baseUrl0);

    const nextSlug = clean("");
    const rawNext  = clean("");
    const nextHref = (!isToken(rawNext) && rawNext) || (nextSlug ? (nextSlug + ".html") : "");

    const url      = clean("");
    const download = clean("");

    let rawMode = "";
    let mode = (!rawMode || isToken(rawMode)) ? "payment" : clean(rawMode).toLowerCase();
    if (mode === "checkout") mode = "payment";

    if (mode === "payment" && pk && priceId && nextHref) {
      const stripe = Stripe(pk);
      btn.onclick = async (e) => {
        e.preventDefault();
        const successUrl = baseUrl + nextHref;   
        const cancelUrl  = window.location.href;
        const { error } = await stripe.redirectToCheckout({
          lineItems: [{ price: priceId, quantity: 1 }],
          mode: "payment",
          successUrl,
          cancelUrl
        });
        if (error) console.warn("Stripe error:", error.message);
      };
      return;
    }

    if (mode === "payment" && payLink && !isToken(payLink)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = payLink; };
      return;
    }

    if (mode === "next" && nextHref) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = nextHref; };
      return;
    }

    if (mode === "url" && url && !isToken(url)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = url; };
      return;
    }

    if (download && !isToken(download)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = download; };
      return;
    }

    btn.style.display = "none";
  });
</script>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  const val = (s)=> (s||"").toString().trim();
  const isToken = (s)=> /\{\{[^}]+\}\}/.test(s||"");
  const isHttp = (u)=>{ try{ const x=new URL((u||'').trim()); return x.protocol==='http:'||x.protocol==='https:'; }catch(_){ return false; } };
  const isRel  = (u)=> /^(\/|\.\/|\.\.\/)/.test((u||"").trim());

  const wrap = document.getElementById('media-a');
  const img  = document.getElementById('img-a');
  const vid  = document.getElementById('vid-a');
  const emb  = document.getElementById('emb-a');

  const imgSrc = val(img?.getAttribute('src'));
  const mp4Src = val("https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fvendredi21-i7pnm%2Fpage1-video-1757056739924?alt=media&token=4d186018-4ab8-4904-870b-4ae3e4535695");
  const embSrc = val(emb?.getAttribute('src'));

  const hasImg = !!imgSrc && !isToken(imgSrc) && (isHttp(imgSrc) || isRel(imgSrc) || /^data:image/i.test(imgSrc));
  const hasVid = !!mp4Src && !isToken(mp4Src) && (isHttp(mp4Src) || isRel(mp4Src));
  const hasEmb = !!embSrc && !isToken(embSrc) && (isHttp(embSrc) || isRel(embSrc));

  if (hasImg) {
    if (img)  { img.style.display='block'; img.classList.remove('hide'); }
    if (vid)  { vid.removeAttribute('src'); vid.style.display='none'; vid.classList.add('hide'); }
    if (emb)  { emb.style.display='none';  emb.classList.add('hide'); }
    wrap.style.display='flex';
    return;
  }

  if (hasVid && vid) {
    vid.src = mp4Src;
    vid.style.display='block';
    vid.classList.remove('hide');
    if (img) { img.style.display='none'; img.classList.add('hide'); }
    if (emb) { emb.style.display='none'; emb.classList.add('hide'); }
    wrap.style.display='flex';
    return;
  }

  if (hasEmb && emb) {
    emb.style.display='block';
    emb.classList.remove('hide');
    if (img) { img.style.display='none'; img.classList.add('hide'); }
    if (vid) { vid.removeAttribute('src'); vid.style.display='none'; vid.classList.add('hide'); }
    wrap.style.display='flex';
    return;
  }

  if (wrap) wrap.style.display='none';
});
</script>


  <!-- Timer (evergreen ou deadline ISO) -->
  <script>
    (function(){
      const clean = (s)=> (s||"").toString().trim();
      const t = document.getElementById('timer');
      if(!t) return;

      const evergreen = parseInt('',10) || 0;
      const deadlineISO = clean('');

      function render(sec){
        if(sec<=0){ t.textContent='Offre expirée'; return; }
        const m=Math.floor(sec/60), s=sec%60;
        t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s';
      }

      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) {
        total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      }

      if(total>0){
        t.style.display='block';
        (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })();
      }
    })();
  </script>
