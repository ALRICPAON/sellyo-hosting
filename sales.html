<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales</title>
  <style>
    :root{--bg:#0b1220;--btn:#3b82f6;--text:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:980px;margin:40px auto;padding:24px}
    header{display:flex;justify-content:center;margin-bottom:16px}
    #logo{max-height:48px;display:none}
    h1{margin:8px 0 6px;text-align:center}
    p.muted{opacity:.75;text-align:center}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    ul{padding-left:18px}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .badge{background:#ffffff20;padding:6px 10px;border-radius:999px;font-size:12px}
    .cta{display:flex;gap:12px;justify-content:center;margin-top:16px}
    button{padding:12px 18px;border:0;border-radius:12px;background:var(--btn);color:#fff;font-weight:700;cursor:pointer}
    #secondary-cta{background:#666}
    video,iframe,img{max-width:100%;border-radius:12px}
    details{background:#ffffff10;padding:12px;border-radius:10px}
  </style>
</head>
<body>
<main>
  <header><img id="logo" alt="Logo"></header>

  <h1 data-slot="headline">Titre vente</h1>
  <p class="muted" data-slot="subtitle"></p>

  <section class="grid">
    <div>
      <section id="hero-image" data-optional="image"><img id="hero-img" alt=""></section>
      <section id="hero-video" data-optional="video" style="margin-top:10px">
        <video id="hero-mp4" controls style="display:none"></video>
        <div id="hero-embed" style="aspect-ratio:16/9;display:none"></div>
      </section>
    </div>
    <div>
      <h3>Points clés</h3>
      <ul data-slot="bullets"></ul>

      <h3>Bénéfices</h3>
      <ul data-slot="benefits"></ul>

      <p><strong>Garantie :</strong> <em data-slot="guarantee"></em></p>
      <div class="badges" id="badges"></div>
    </div>
  </section>

  <section class="grid">
    <div>
      <h3>Problème</h3>
      <p data-slot="problem"></p>
    </div>
    <div>
      <h3>Solution</h3>
      <p data-slot="solution"></p>
    </div>
  </section>

  <section id="product">
    <h3>Ce que vous obtenez</h3>
    <p data-slot="productDescription"></p>
  </section>

  <section>
    <h3>Témoignages</h3>
    <div id="testimonials"></div>
  </section>

  <section>
    <h3>Questions fréquentes</h3>
    <div id="faqs"></div>
  </section>

  <section id="timer-block" style="display:none">
    <h3>Offre limitée</h3>
    <p id="countdown" style="font-size:28px;font-weight:800"></p>
  </section>

  <div class="cta">
    <button id="primary-cta"><span data-slot="ctaPrimary">Continuer</span></button>
    <button id="secondary-cta" style="display:none"><span data-slot="ctaSecondary">Non merci</span></button>
  </div>
</main>

<script type="module">
  import { injectSlots } from "./js/inject-content.js";

  const $ = (s)=>document.querySelector(s);
  const show = (el)=>{ if(el) el.style.display=""; };
  const hide = (el)=>{ if(el) el.style.display="none"; };

  // --- helpers d’affichage ---
  function setText(sel, v){
    const el = $(sel);
    if(!el) return false;
    const val = (v||"").toString().trim();
    if(!val){ el.textContent=""; hide(el); return false; }
    el.textContent = val; show(el); return true;
  }
  function setBullets(sel, arr){
    const el = $(sel);
    if(!el) return 0;
    const items = (arr||[]).map(s=>String(s||"").trim()).filter(Boolean);
    if(!items.length){ el.innerHTML=""; hide(el); return 0; }
    el.innerHTML = items.map(i=>`<li>${i}</li>`).join("");
    show(el); return items.length;
  }
  function hideIfEmptyBlock(titleSel, contentSel){
    const t = $(titleSel), c = $(contentSel);
    if(!t || !c) return;
    const isEmpty = (c.tagName==="UL") ? !c.querySelector("li") : !c.textContent.trim();
    if(isEmpty){ hide(t); hide(c); } else { show(t); show(c); }
  }
  function renderBadges(list=[]) {
    const host = $("#badges");
    if(!host) return;
    const items = (list||[]).filter(Boolean);
    if(!items.length){ host.innerHTML=""; hide(host); return; }
    host.innerHTML = items.map(b=>`<span class="badge">${b}</span>`).join("");
    show(host);
  }
  function renderTestimonials(list=[]) {
    const host = $("#testimonials");
    const section = host?.closest("section");
    if(!host || !section) return;
    const items = Array.isArray(list)?list:[];
    if(!items.length){ host.innerHTML=""; hide(section); return; }
    host.innerHTML = items.map(t=>`
      <details><summary><strong>${t.name || "Avis"}</strong></summary><p>${t.text || ""}</p></details>
    `).join("");
    show(section);
  }
  function renderFaqs(list=[]) {
    const host = $("#faqs");
    const section = host?.closest("section");
    if(!host || !section) return;
    const items = Array.isArray(list)?list:[];
    if(!items.length){ host.innerHTML=""; hide(section); return; }
    host.innerHTML = items.map(f=>`
      <details><summary>${f.q || "Question"}</summary><p>${f.a || ""}</p></details>
    `).join("");
    show(section);
  }
  function startTimer(cfg) {
    const enabled = !!(cfg.components?.timer);
    const minutes = Number(cfg.timers?.evergreenMinutes ?? 0);
    const deadline = cfg.timers?.deadlineISO || null;
    const block = $("#timer-block");
    if(!enabled || (!minutes && !deadline)){ hide(block); return; }

    show(block);
    const label = document.getElementById("countdown");
    const end = deadline ? new Date(deadline).getTime() : Date.now() + minutes*60*1000;

    const tick = ()=>{
      const rest = Math.max(0, end - Date.now());
      const s = Math.floor(rest/1000)%60;
      const m = Math.floor(rest/60000)%60;
      const h = Math.floor(rest/3600000);
      label.textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      if(rest<=0) clearInterval(iv);
    };
    tick();
    const iv = setInterval(tick, 1000);
  }

  // Choisit le fichier réel de la prochaine page (optin/sales/checkout/thankyou…)
  async function resolveNextUrl(userId, nextSlug){
    if(!nextSlug) return "";
    const repo = (location.pathname.split("/")[1] || "");
    const rootPath = repo ? `/${repo}/` : "/";
    const base = `${location.origin}${rootPath}`;
    try {
      const res = await fetch(`${base}tunnels/${encodeURIComponent(userId)}/${encodeURIComponent(nextSlug)}.json`, {cache:"no-store"});
      const cfgNext = res.ok ? await res.json() : null;
      const type = (cfgNext?.pageType || cfgNext?.type || "checkout").toLowerCase();
      const map = { optin:"optin", sales:"sales", checkout:"checkout", thankyou:"thankyou", upsell:"sales", downsell:"sales", webinar:"sales" };
      const file = map[type] || "checkout";
      return `${file}.html?slug=${encodeURIComponent(nextSlug)}&userId=${encodeURIComponent(userId)}`;
    } catch {
      return `checkout.html?slug=${encodeURIComponent(nextSlug)}&userId=${encodeURIComponent(userId)}`;
    }
  }

  (async () => {
    try {
      const qs  = new URLSearchParams(location.search);
      const slug = qs.get("slug");
      const uid  = qs.get("userId");

      // inject-content gère : logo, image, vidéo, thème, headline, bullets de base
      const cfg = await injectSlots({ slug, page: "sales" });

      // — Texte étendu & masquage des blocs vides —
      const hadSubtitle = setText('[data-slot="subtitle"]', cfg.subtitle || "");
      if(!hadSubtitle){ hide($('[data-slot="subtitle"]')); }

      setBullets('[data-slot="benefits"]', Array.isArray(cfg.copy?.benefits) ? cfg.copy.benefits : []);
      hideIfEmptyBlock('h3:has(+ ul[data-slot="benefits"])', 'ul[data-slot="benefits"]'); // support moderne
      // Fallback si :has n’est pas supporté
      if(!CSS.supports('selector(:has(*))')){
        const ben = $('ul[data-slot="benefits"]');
        const title = ben ? ben.previousElementSibling : null;
        if(ben && title && !ben.querySelector('li')){ hide(title); hide(ben); }
      }

      setText('[data-slot="problem"]', cfg.copy?.problem || "");
      hideIfEmptyBlock('h3:has(+ p[data-slot="problem"])', 'p[data-slot="problem"]');

      setText('[data-slot="solution"]', cfg.copy?.solution || "");
      hideIfEmptyBlock('h3:has(+ p[data-slot="solution"])', 'p[data-slot="solution"]');

      setText('[data-slot="guarantee"]', cfg.copy?.guarantee || "");
      // ton HTML met <strong>Garantie :</strong> … → on masque le <p> complet si vide
      const gP = document.querySelector('em[data-slot="guarantee"]')?.closest('p');
      if(gP && !gP.querySelector('em')?.textContent.trim()) hide(gP);

      // Produit
      const prodSec = document.getElementById("product");
      const hadProd = setText('[data-slot="productDescription"]', cfg.productDescription || "");
      if(prodSec && !hadProd) hide(prodSec);

      // Badges / Témoignages / FAQ / Timer
      renderBadges(cfg.components?.badges || []);
      renderTestimonials(cfg.testimonials || []);
      renderFaqs(cfg.faqs || []);
      startTimer(cfg);

      // — Navigation vers la page suivante + paiement —
      const nextSlug = cfg.flow?.nextSlug || (cfg.slug?.replace(/-p(\d+)$/, (_,n)=>`-p${(+n+1)}`));
      const priceId  = (cfg.pricing && cfg.pricing.priceId) ? cfg.pricing.priceId : "";
      const payLink  = (cfg.payment && cfg.payment.paymentLink) ? cfg.payment.paymentLink : "";

      const goNext = async () => {
        // 1) si Stripe PriceId → on force le checkout avec priceId dans l’URL
        if (priceId) {
          const url = await resolveNextUrl(uid, nextSlug); // devrait pointer vers checkout.html
          const u = new URL(url, location.href);
          u.searchParams.set("priceId", priceId);
          location.href = u.toString();
          return;
        }
        // 2) sinon s’il y a un paymentLink (Stripe Checkout Link / autre)
        if (payLink) {
          location.href = payLink;
          return;
        }
        // 3) sinon navigation simple vers la page suivante détectée
        const url = await resolveNextUrl(uid, nextSlug);
        if (url) location.href = url;
      };

      $('#primary-cta')?.addEventListener('click', goNext);

      const second = $('#secondary-cta');
      if (second && cfg.flow?.declineSlug) {
        second.style.display = "";
        second.addEventListener("click", async () => {
          const url = await resolveNextUrl(uid, cfg.flow.declineSlug);
          if(url) location.href = url;
        });
      } else {
        // masquer le bouton si pas de decline
        if (second) hide(second);
      }
    } catch (e) {
      console.error("[sales] error", e);
    }
  })();
</script>
</body>
</html>
