<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paiement</title>
  <style>
    :root{--bg:#0b1220;--btn:#3b82f6;--text:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:560px;margin:40px auto;padding:24px;text-align:center}
    button{padding:14px 18px;border:0;border-radius:12px;background:var(--btn);color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1 data-slot="headline">Confirme ton accès</h1>
  <ul data-slot="bullets"></ul>
  <p id="msg"></p>
  <button id="pay"><span data-slot="cta">Procéder au paiement</span></button>
</main>

<script type="module">
  import { injectSlots } from "/js/inject-content.js";
  const qs = new URLSearchParams(location.search);
  const slug = qs.get("slug");
  const uid = qs.get("userId");
  const overridePrice = qs.get("priceId");
  let cfg;
  injectSlots({ slug, page: "checkout" }).then(c=>cfg=c);

  document.getElementById("pay").onclick = async ()=>{
    try{
      const r = await fetch("https://YOUR_FUNCTION_URL/createCheckoutSession", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          priceId: overridePrice || cfg.pricing.priceId,
          userId: uid,
          slug: cfg.slug,
          baseUrl: cfg.baseUrl
        })
      });
      const { url, error } = await r.json();
      if(error) throw new Error(error);
      location.href = url;
    }catch(e){ document.getElementById("msg").textContent = "Erreur paiement : "+e.message; }
  };
</script>
</body>
</html>
