<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merci</title>
  <style>
    :root{--bg:#0b1220;--btn:#3b82f6;--text:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:560px;margin:40px auto;padding:24px;text-align:center}
    a.btn{display:inline-block;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>✅ Paiement confirmé</h1>
  <p data-slot="headline">Ton accès est prêt.</p>
  <p><a id="deliver" class="btn" href="#" target="_blank">Accéder</a></p>
</main>

<script type="module">
  import { injectSlots } from "./js/inject-content.js?v=fix1";

  (async () => {
    try {
      const qs  = new URLSearchParams(location.search);
      const slug = qs.get("slug");
      const cfg  = await injectSlots({ slug, page: "thankyou" });

      const url = cfg.deliverable?.url || cfg.delivery?.productUrl || "#";
      const a = document.getElementById("deliver");
      a.href = url;
      if (url === "#") a.textContent = "Lien indisponible";
    } catch (e) { console.error("[thankyou] error", e); }
  })();
</script>
</body>
</html>
