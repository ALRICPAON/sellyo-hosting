<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>meta | test sales3</title>
  <meta name="description" content="metaa" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg: #61177c; --btn: #e63b7a; --text:#fff }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5}
    main{max-width:1100px;margin:0 auto;padding:24px}

    header{display:flex;justify-content:center;align-items:center;padding:16px 0}
    #logo{max-height:56px;display:none}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px;margin-bottom:24px}
    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer;margin-top:12px}
    .bullets ul{padding-left:18px;margin:12px 0}
    .bullets li{margin-bottom:8px;list-style:disc}

    .media img,.media video,.media iframe{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
    .media iframe{aspect-ratio:16/9;border:0}

    #pair-a{display:grid;gap:18px;grid-template-columns:1fr}
    @media(min-width:880px){ #pair-a.two-cols{ grid-template-columns:1fr 1fr; } }
    #pair-a.center .media-a{display:none}
    #pair-a.center #text-col{max-width:600px;margin:0 auto;text-align:center}

    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
    .hide{display:none!important}
  </style>
  <script src="https://js.stripe.com/v3"></script>
</head>
<body>
  <main>
    <header>
      <img id="logo" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-sales3-0jsb5%2Flogo-1757087531537?alt=media&token=bdc64720-dbdd-4538-96c4-3113b1f07b69" alt="Logo" onerror="this.style.display='none'">
    </header>

    <!-- Section principale Hero -->
    <section class="hero" id="hero">
      <h1 id="title">test</h1>
      <p class="sub" id="subtitle">titre</p>
    </section>

    <!-- Bloc principal : Média gauche + Contenu droite -->
    <section class="card" id="block-a">
      <div id="pair-a">
        <!-- Média -->
        <div class="media media-a" id="media-a">
          <img id="img-a" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-sales3-0jsb5%2Fpage1-hero-1757087532819?alt=media&token=ddb7c9ab-d99f-4113-a9b3-9c3fd9160456" alt="" onerror="this.style.display='none'">
          <video id="vid-a" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-sales3-0jsb5%2Fpage1-video-1757087533860?alt=media&token=751f70d1-6446-4f15-bb01-3f1334cb3e4e" controls playsinline class="hide" onerror="this.style.display='none'"></video>
          <iframe id="emb-a" src="" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- Texte / contenu -->
        <div id="text-col">
          <div id="desc">description</div>
          <div class="bullets">clé</div>
          <div id="prob">probleme</div>
          <div id="sol">solution</div>
          <div id="ben">benefice</div>
          <div id="gua"><em>garantie</em></div>
          <div id="timer" class="timer hide"></div>
          <button class="btn" id="cta-btn">je test</button>
        </div>
      </div>
    </section>

    <!-- Témoignages + FAQ -->
    <section class="card hide" id="testi">
      <h3>Témoignages</h3>
      <div id="testi-body">temoin</div>
    </section>

    <section class="card hide" id="faq">
      <h3>FAQ</h3>
      <div id="faq-body">question</div>
    </section>

    <footer>
      <p>&copy; meta | test sales3 - Tous droits réservés.</p>
    </footer>
  </main>

<script>
// Logo visible uniquement si src valide
(function(){
  const logo=document.getElementById('logo');
  if(logo && logo.src && /^(https?:|data:image)/.test(logo.src)){
    logo.style.display='block';
  }
})();

// Gestion dynamique médias (même logique Optin)
(function(){
  const pair=document.getElementById('pair-a');
  const img=document.getElementById('img-a');
  const vid=document.getElementById('vid-a');
  const emb=document.getElementById('emb-a');
  const isHttp=u=>{ try{ return new URL(u).protocol.startsWith('http'); }catch(_){ return false; } };

  const hasImg=isHttp(img?.src||'');
  const hasVid=isHttp(vid?.src||'');
  const hasEmb=isHttp(emb?.src||'');
  const hasAny=hasVid||hasEmb;

  [vid,emb].forEach(el=>{ if(el){ el.classList.add('hide'); el.style.display='none'; }});

  if(!hasImg && !hasAny){
    pair.classList.add('center');
    return;
  }

  if(hasImg && hasAny){
    pair.classList.add('two-cols');
    img.style.display='block';
    if(hasVid){ vid.classList.remove('hide'); vid.style.display='block'; }
    else if(hasEmb){ emb.classList.remove('hide'); emb.style.display='block'; }
    return;
  }

  if(hasImg && !hasAny){
    pair.classList.add('two-cols');
    img.style.display='block';
    return;
  }

  if(!hasImg && hasAny){
    pair.classList.add('two-cols');
    if(hasVid){ vid.classList.remove('hide'); vid.style.display='block'; }
    else if(hasEmb){ emb.classList.remove('hide'); emb.style.display='block'; }
    return;
  }
})();
</script>

<!-- Stripe : gestion paiement + redirection -->
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const btn=document.getElementById("cta-btn");
  if(!btn)return;
  const clean=s=>(s||"").toString().trim();
  const isToken=s=>/\{\{[^}]+\}\}/.test(s||"");
  const withSlash=u=>u?(u.endsWith('/')?u:(u+'/')):"";
  const pk=clean("pk_test_51RVsTD4PUVU3ejcHlK1AAkobBcOKPp3k0l9AHMmq68d7OdSDjyVKLtA9XpMGqiUIeIgtMvhSTUDrMl9rPityqi5u002UMlmdET");
  const priceId=clean("price_1Rx31U4PUVU3ejcHtRO3U55v");
  const payLink=clean("");
  const baseUrl=withSlash(clean("https://alricpaon.github.io/sellyo-hosting/tunnels/pOoqftYacXhirXtjxVk60Or09nm2"));
  const nextSlug=clean("test-sales3-0jsb5-p2");
  const rawNext=clean("test-sales3-0jsb5-p2.html");
  const nextHref=(!isToken(rawNext)&&rawNext)||(nextSlug?(nextSlug+".html"):"");

  if(pk && priceId && nextHref){
    const stripe=Stripe(pk);
    btn.onclick=async(e)=>{
      e.preventDefault();
      const successUrl=baseUrl+nextHref;
      const cancelUrl=window.location.href;
      const {error}=await stripe.redirectToCheckout({lineItems:[{price:priceId,quantity:1}],mode:"payment",successUrl,cancelUrl});
      if(error)console.warn("Stripe:",error.message);
    };
    return;
  }
  if(payLink&&!isToken(payLink))btn.onclick=(e)=>{e.preventDefault();window.location.href=payLink};
  else if(nextHref)btn.onclick=(e)=>{e.preventDefault();window.location.href=nextHref};
});
</script>

<!-- Timer dynamique -->
<script>
(function(){
  const t=document.getElementById('timer');if(!t)return;
  const clean=s=>(s||"").toString().trim();
  const evergreen=parseInt('30',10)||0;
  const deadlineISO=clean('');
  function render(sec){if(sec<=0){t.textContent='Offre expirée';return;}const m=Math.floor(sec/60),s=sec%60;t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s'}
  let total=0;
  if(evergreen>0)total=evergreen*60;
  else if(deadlineISO&&!isNaN(Date.parse(deadlineISO)))total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
  if(total>0){t.classList.remove('hide');(function tick(){render(total--);if(total>=0)setTimeout(tick,1000)})();}
})();
</script>
</body>
</html>
