<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>{{seo.metaTitle}}</title>
  <meta name="description" content="{{seo.metaDescription}}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root {
      --bg: {{ui.mainColor}};
      --btn: {{ui.buttonColor}};
      --text: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: center; padding: 16px 0; }
    header img { max-height: 56px; display: block; }
    .card {
      background: #ffffff10;
      border: 1px solid #ffffff14;
      border-radius: 16px;
      padding: 18px;
    }
    .hero { text-align: center; margin-bottom: 16px; }
    .hero h1 { font-size: clamp(28px, 3.5vw, 42px); margin: 8px 0; }
    .sub { opacity: .9; margin: 0; }
    .grid { display: grid; gap: 18px; }
    .two-cols { grid-template-columns: 1fr; }
    @media(min-width:880px){ .two-cols{ grid-template-columns:1.1fr .9fr } }
    .pair { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media(min-width:880px){ .pair{ grid-template-columns: 1fr 1fr } }
    .media img, .media video {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--btn);
      color: #fff;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border: 0;
      cursor: pointer;
    }
    form input, form select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 0;
      margin: 8px 0;
      background: #ffffff12;
      color: #fff;
    }
    .timer {
      font-weight: 800;
      text-align: center;
      margin: 12px 0;
      font-size: 20px;
      color: #facc15;
    }
    .hide { display: none; }
    #download-btn {
      display: block;
      text-align: center;
      margin-top: 16px;
      background: #22c55e;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
<header>
  <img src="{{brand.logoUrl}}" alt="Logo" onerror="this.style.display='none'">
</header>
<main>
  <!-- HERO -->
  <section class="card hero">
    <h1>{{copy.title}}</h1>
    <p class="sub">{{copy.subtitle}}</p>
  </section>

  <!-- CONTENU PRINCIPAL -->
  <section class="grid two-cols">
    <!-- COLONNE GAUCHE -->
    <div class="card">
      <div class="pair">
        <div class="media" id="mwrap">
          <img id="img" src="{{media.imageUrl}}" alt="" onerror="this.style.display='none'">
          <video id="vid" src="{{media.videoMp4}}" controls playsinline onerror="this.style.display='none'"></video>
        </div>
        <div>
          <!-- TIMER -->
          <div id="timer" class="timer hide"></div>
          <!-- FORMULAIRE -->
          <form id="lead-form" data-role="capture" data-next="{{flow.nextHref}}">
            <input type="text" name="firstname" placeholder="Prénom" required>
            <input type="email" name="email" placeholder="Email" required>
            <!-- requis pour save-lead-tunnel.js -->
            <input type="hidden" name="userId" value="{{userId}}"/>
            <input type="hidden" name="pageSlug" value="{{slug}}"/>
            <input type="hidden" name="slug" value="{{slug}}"/>
            <input type="hidden" name="type" value="tunnel"/>
            <input type="hidden" name="nextUrl" value="{{flow.nextHref}}"/>
            <button type="submit" class="btn">{{copy.ctaText}}</button>
          </form>
          <!-- GARANTIE -->
          <div class="hide" id="gua"><em>{{copy.guarantee}}</em></div>
          <!-- BOUTON DE TÉLÉCHARGEMENT LIVRABLE -->
          <a id="download-btn" class="hide" href="{{deliverable.url}}" target="_blank">📥 Télécharger les ressources</a>
        </div>
      </div>
    </div>

    <!-- COLONNE DROITE -->
    <div class="card">
      <div id="desc">{{copy.productDescription}}</div>
      <div id="bul">{{copy.bullets}}</div>
      <div id="ben">{{copy.benefits}}</div>
    </div>
  </section>

  <!-- SECTIONS OPTIONNELLES -->
  <section class="card hide" id="testi"><h3>Témoignages</h3><div>{{testimonials}}</div></section>
  <section class="card hide" id="faq"><h3>FAQ</h3><div>{{faqs}}</div></section>
</main>

<!-- Firebase & Save Lead -->
<script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/firebase-init.js"></script>
<script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/save-lead-tunnel.js"></script>

<script>
const clean = s => (s || "").trim();

// Gestion des médias (masquer si absent)
(function(){
  const img = document.getElementById('img');
  const vid = document.getElementById('vid');
  const wrap = document.getElementById('mwrap');
  const hasImg = !!clean(img.getAttribute('src'));
  const hasVid = !!clean(vid.getAttribute('src'));
  if(!hasVid && !hasImg) wrap.style.display = 'none';
  if(hasVid && hasImg) img.style.display = 'none';
})();

// Gestion du timer
(function(){
  const t=document.getElementById('timer');
  const ever=parseInt('{{timers.evergreenMinutes}}',10)||0;
  const iso='{{timers.deadlineISO}}'.trim();
  let total=0;
  if(ever>0) total=ever*60;
  else if(iso && !isNaN(Date.parse(iso)))
    total=Math.max(0,Math.floor((new Date(iso)-new Date())/1000));
  function render(sec){
    if(sec<=0){ t.textContent='Le webinaire commence'; return; }
    const m=Math.floor(sec/60), s=sec%60;
    t.textContent='Démarre dans '+m+'m '+('0'+s).slice(-2)+'s';
  }
  if(total>0){ t.classList.remove('hide'); (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })(); }
})();

// Afficher la garantie, témoignages, FAQ
(function(){
  const gua=document.getElementById('gua');
  if(gua && clean(gua.textContent)) gua.classList.remove('hide');
  ['testi','faq'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    const c=el.querySelector('div');
    if(c && clean(c.textContent)) el.classList.remove('hide');
  });
})();

// Bouton livrable conditionnel
(function(){
  const btn=document.getElementById('download-btn');
  const url='{{deliverable.url}}'.trim();
  if(url && url!=='{{deliverable.url}}') btn.classList.remove('hide');
})();

// Pixels tracking FB & GTM
(function(){
  const fb='{{analytics.fbPixelId}}'.trim();
  if(fb){
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src='https://connect.facebook.net/en_US/fbevents.js';
      s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)
    }(window,document,'script');
    fbq('init',fb); fbq('track','PageView');
  }
  const gtm='{{analytics.gtmId}}'.trim();
  if(gtm){
    var s=document.createElement('script');
    s.async=1;
    s.src='https://www.googletagmanager.com/gtm.js?id='+gtm;
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
