<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>{{seo.metaTitle}}</title>
  <meta name="description" content="{{seo.metaDescription}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{ --bg: {{ui.mainColor}}; --btn: {{ui.buttonColor}}; --text:#fff }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:24px}

    header{display:flex;justify-content:center;padding:16px 0}
    #logo{max-height:56px;display:none}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}
    form input,form textarea,form select{width:100%;padding:12px;border-radius:10px;border:0;margin:8px 0;background:#ffffff12;color:#fff}

    /* ===== Grids ===== */
    #block-a{max-width:1100px;margin:0 auto}
    #pair-a{display:grid;gap:18px;grid-template-columns:1fr}
    @media(min-width:880px){ #pair-a.two-cols{ grid-template-columns:1fr 1fr; } }
    #pair-a.center .media-a{display:none}
    #pair-a.center #form-col{max-width:460px;margin:0 auto}

    .media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
    .media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}

    #argu-grid{display:grid;gap:18px;grid-template-columns:1fr}
    @media(min-width:880px){ #argu-grid.two-cols{ grid-template-columns:1fr 0.95fr; align-items:start } }
    #argu-grid.center video,#argu-grid.center iframe{max-width:720px;margin:0 auto;display:block}

    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
    .hide{display:none}
  </style>
</head>
<body>
  <main>
    <header>
      <img id="logo" src="{{brand.logoUrl}}" alt="Logo" onerror="this.style.display='none'">
    </header>

    <!-- 1) Hero -->
    <section class="hero" id="hero">
      <h1 id="title">{{copy.title}}</h1>
      <p class="sub" id="subtitle">{{copy.subtitle}}</p>
    </section>

    <!-- 2) Description -->
    <section class="card" id="desc-wrap">
      <div id="desc">{{copy.productDescription}}</div>
    </section>

    <!-- ===== Bloc A : Média (gauche) + Formulaire (droite) ===== -->
    <section class="card" id="block-a">
      <div id="pair-a">
        <!-- Média A -->
        <div class="media media-a" id="media-a">
          <img   id="img-a" src="{{media.imageUrl}}" alt="" onerror="this.style.display='none'">
          <video id="vid-a" src="{{media.videoMp4}}" controls playsinline class="hide" onerror="this.style.display='none'"></video>
          <iframe id="emb-a" src="{{media.videoEmbed}}" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- Formulaire -->
        <div id="form-col">
          <div id="timer" class="timer hide"></div>

          <script id="form-fields-json" type="application/json">{{formFields}}</script>

          <form id="lead-form" data-role="capture" data-next="{{flow.nextHref}}">
            <div id="form-visible"></div>

            <input type="hidden" name="userId" value="{{userId}}" />
            <input type="hidden" name="pageSlug" value="{{slug}}" />
            <input type="hidden" name="slug" value="{{slug}}" />
            <input type="hidden" name="type" value="tunnel" />
            <input type="hidden" id="nextUrl-hidden" name="nextUrl" value="" />

            <button type="submit" class="btn" id="cta-btn">{{copy.ctaText}}</button>
            <div id="gua" class="hide" style="margin-top:10px"><em>{{copy.guarantee}}</em></div>
          </form>

          <!-- Remplacement si cta.action = paiement|lien -->
          <a id="cta-link" class="btn hide" href="#" rel="nofollow noopener">{{copy.ctaText}}</a>
        </div>
      </div>
    </section>

    <!-- ===== Bloc B : Texte (gauche) + Vidéo (droite) — seulement si image ET (vidéo|embed) ===== -->
    <section class="card hide" id="block-b">
      <div id="argu-grid">
        <div id="argu-left">
          <div id="prob">{{copy.problem}}</div>
          <div id="sol">{{copy.solution}}</div>
          <div id="ben">{{copy.benefits}}</div>
          <div id="bul">{{copy.bullets}}</div>
        </div>
        <div class="media" id="argu-video">
          <video id="vid-b" src="{{media.videoMp4}}" controls playsinline class="hide" onerror="this.style.display='none'"></video>
          <iframe id="emb-b" src="{{media.videoEmbed}}" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- Témoignages + FAQ -->
    <section class="card hide" id="testi">
      <h3>Témoignages</h3>
      <div>{{copy.testimonials}}</div>
    </section>

    <section class="card hide" id="faq">
      <h3>FAQ</h3>
      <div>{{copy.faq}}</div>
    </section>
  </main>

  <!-- Firebase + capture -->
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/firebase-init.js"></script>
  <script type="module" src="https://alricpaon.github.io/sellyo-hosting/js/save-lead-tunnel.js"></script>

  <script>
    /* ---------- Helpers ---------- */
    const cleanText = (s) => (s||"").toString().replace(/^['"\\s]+|['"\\s]+$/g,'').trim();
    const isHttp = (u)=>{ try{ const x=new URL((u||'').trim()); return x.protocol==='http:'||x.protocol==='https:'; }catch(_){ return false; } };

    // Couleur de fond fallback (au cas où token non remplacé)
    (function(){
      const v=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (!v || v==='{{ui.mainColor}}'){
        document.documentElement.style.setProperty('--bg', '#111');
      }
    })();

    // Nettoyage des éventuels ``` fuites
    (function(){
      const kill = (s)=> (s||'').replace(/```html?/gi,'').replace(/```/g,'');
      ['desc','prob','sol','ben','bul','testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        el.innerHTML = kill(el.innerHTML||'');
      });
    })();

    // Logo + blocs vides
    (function(){
      const logo=document.getElementById('logo');
      if (logo && cleanText(logo.getAttribute('src'))) logo.style.display='block';

      const title=document.getElementById('title');
      const subtitle=document.getElementById('subtitle');
      const desc=document.getElementById('desc');
      if (!cleanText(title.textContent) && !cleanText(subtitle.textContent)) document.getElementById('hero').style.display='none';
      if (!cleanText(subtitle.textContent)) subtitle.style.display='none';
      if (!cleanText(desc.textContent)) document.getElementById('desc-wrap').style.display='none';
    })();

    // Form fields: accepte array | objet flags | string "email,name"
    (function(){
      const host = document.getElementById('form-visible');
      const raw  = document.getElementById('form-fields-json')?.textContent || '[]';
      const looksLikeToken = /\{\{[^}]+\}\}/.test(raw);
      if (!raw || looksLikeToken) { host.innerHTML = `<input name="email" type="email" placeholder="Votre email" required/>`; return; }

      function input(type, name, placeholder, required=true, options=null){
        const req = required ? 'required' : '';
        if (type==='textarea') return `<textarea name="${name}" placeholder="${placeholder}" ${req}></textarea>`;
        if (type==='select' && Array.isArray(options)){
          const opts=options.map(o=>`<option value="${(o.value??o)}">${(o.label??o)}</option>`).join('');
          return `<select name="${name}" ${req}>${opts}</select>`;
        }
        return `<input name="${name}" type="${type}" placeholder="${placeholder}" ${req}/>`;
      }
      function fromArray(arr){
        if (!Array.isArray(arr)) return '';
        return arr.map(f=>{
          const t=(f.type||'text').toLowerCase(), n=f.name||'field', ph=f.placeholder||f.label||n;
          return input(t,n,ph,!!f.required,Array.isArray(f.options)?f.options:null);
        }).join('');
      }
      function fromObject(obj){
        const order=['firstname','name','email','phone','address'];
        const keys=order.filter(k=>obj[k]).concat(Object.keys(obj).filter(k=>!order.includes(k) && obj[k]));
        if (!keys.length) return '';
        return keys.map(k=>{
          const key=k.toLowerCase();
          if (key==='email') return input('email','email','Votre email');
          if (key==='phone') return input('tel','phone','Votre téléphone');
          if (key==='address') return input('textarea','address','Votre adresse');
          if (key==='firstname') return input('text','firstname','Votre prénom');
          if (key==='name'||key==='lastname') return input('text','name','Votre nom');
          return input('text',key,key);
        }).join('');
      }
      function fromString(str){
        const parts=(str||'').split(',').map(s=>s.trim()).filter(Boolean);
        if (!parts.length) return '';
        return fromObject(Object.fromEntries(parts.map(p=>[p,true])));
      }

      let fields; try{ fields=JSON.parse(raw); }catch(e){ fields=raw; }
      let html='';
      if (Array.isArray(fields)) html=fromArray(fields);
      else if (fields && typeof fields==='object') html=fromObject(fields);
      else if (typeof fields==='string') html=fromString(fields);

      if (!html) html=`<input name="email" type="email" placeholder="Votre email" required/>`;
      host.innerHTML=html;
    })();

    /* ========== LOGIQUE LAYOUT DÉTERMINISTE ========== */
    (function(){
      const pairA   = document.getElementById('pair-a');
      const mediaA  = document.getElementById('media-a');
      const imgA    = document.getElementById('img-a');
      const vidA    = document.getElementById('vid-a');
      const embA    = document.getElementById('emb-a');

      const blockB  = document.getElementById('block-b');
      const argu    = document.getElementById('argu-grid');
      const vidB    = document.getElementById('vid-b');
      const embB    = document.getElementById('emb-b');
      const arguLeft= document.getElementById('argu-left');

      // Présences
      const hasImg   = isHttp(imgA?.getAttribute('src')||'');
      const hasVid   = isHttp(vidA?.getAttribute('src')||'') || isHttp(vidB?.getAttribute('src')||'');
      const hasEmb   = isHttp(embA?.getAttribute('src')||'') || isHttp(embB?.getAttribute('src')||'');
      const hasAnyVideo = hasVid || hasEmb;

      const txtProb = cleanText(document.getElementById('prob')?.textContent);
      const txtSol  = cleanText(document.getElementById('sol')?.textContent);
      const txtBen  = cleanText(document.getElementById('ben')?.textContent);
      const txtBul  = cleanText(document.getElementById('bul')?.textContent);
      const hasText = !!(txtProb || txtSol || txtBen || txtBul);

      // Réinitialise états
      [vidA, embA, vidB, embB].forEach(el=>{ if(!el) return; el.classList.add('hide'); el.style.display='none'; });
      if (mediaA) mediaA.style.display = 'block';
      if (blockB) blockB.classList.add('hide');
      if (argu)   argu.classList.remove('two-cols','center');

      // 1) Cas "aucun média" => formulaire centré
      if (!hasImg && !hasAnyVideo) {
        pairA?.classList.remove('two-cols');
        pairA?.classList.add('center');
        return;
      }

      // 2) Cas "image ET (vidéo|embed)" => A=image + B=vidéo
      if (hasImg && hasAnyVideo) {
        // Bloc A
        pairA?.classList.remove('center');
        pairA?.classList.add('two-cols');
        if (imgA) imgA.style.display='block';
        // On masque les vidéos d'A
        if (vidA){ vidA.removeAttribute('src'); }
        if (embA){ embA.removeAttribute('src'); }
        // Bloc B
        blockB?.classList.remove('hide');
        let hasMediaB=false;
        if (isHttp(vidB?.getAttribute('src')||'')) { vidB.classList.remove('hide'); vidB.style.display='block'; hasMediaB=true; }
        else if (isHttp(vidA?.getAttribute('src')||'')) { /* si Make n’a rempli que A, fallback */ vidB.setAttribute('src', vidA.getAttribute('src')); vidB.classList.remove('hide'); vidB.style.display='block'; hasMediaB=true; }
        else if (isHttp(embB?.getAttribute('src')||'')) { embB.classList.remove('hide'); embB.style.display='block'; hasMediaB=true; }
        else if (isHttp(embA?.getAttribute('src')||'')) { embB.setAttribute('src', embA.getAttribute('src')); embB.classList.remove('hide'); embB.style.display='block'; hasMediaB=true; }

        if (hasMediaB && hasText) {
          argu?.classList.add('two-cols');
        } else if (hasMediaB && !hasText) {
          argu?.classList.add('center');
        } else {
          // pas de média utilisable en B → on cache B
          blockB?.classList.add('hide');
        }
        return;
      }

      // 3) Cas "image seule" => A=image + form ; B caché
      if (hasImg && !hasAnyVideo) {
        pairA?.classList.remove('center');
        pairA?.classList.add('two-cols');
        if (imgA) imgA.style.display='block';
        blockB?.classList.add('hide');
        return;
      }

      // 4) Cas "(vidéo|embed) seul(e)" => A=vidéo + form ; B caché
      if (!hasImg && hasAnyVideo) {
        pairA?.classList.remove('center');
        pairA?.classList.add('two-cols');
        // Affiche priorité MP4 puis embed
        if (isHttp(vidA?.getAttribute('src')||'')) { vidA.classList.remove('hide'); vidA.style.display='block'; }
        else if (isHttp(embA?.getAttribute('src')||'')) { embA.classList.remove('hide'); embA.style.display='block'; }
        else if (isHttp(vidB?.getAttribute('src')||'')) { vidA.setAttribute('src', vidB.getAttribute('src')); vidA.classList.remove('hide'); vidA.style.display='block'; }
        else if (isHttp(embB?.getAttribute('src')||'')) { embA.setAttribute('src', embB.getAttribute('src')); embA.classList.remove('hide'); embA.style.display='block'; }
        blockB?.classList.add('hide');
        return;
      }
    })();

    // CTA / nextHref (optin)
    (function(){
      const rawAction = cleanText('{{cta.action}}').toLowerCase();
      const ctaAction = (rawAction === 'checkout') ? 'paiement'
                     : (rawAction === 'url')     ? 'lien'
                     : (rawAction === 'next')    ? 'capture'
                     : rawAction;

      const payLink   = cleanText('{{payment.paymentLink}}');
      const ctaUrl    = cleanText('{{cta.paymentLink}}');
      const payOrUrl  = ctaUrl || payLink;

      const ns1 = cleanText('{{nextHref}}');
      const ns2 = cleanText('{{flow.nextHref}}');
      const ns3 = cleanText('{{cta.nextSlug}}');
      const ns4 = cleanText('{{flow.nextSlug}}');
      let nextHref = ns1 || ns2 || '';
      if (nextHref === '.html') nextHref = '';
      if (!nextHref){
        const slug = ns3 || ns4;
        if (slug) nextHref = slug.endsWith('.html') ? slug : (slug + '.html');
      }

      const hidden = document.getElementById('nextUrl-hidden');
      if (hidden) hidden.value = nextHref || '';

      const form = document.getElementById('lead-form');
      const link = document.getElementById('cta-link');
      if (form) form.setAttribute('data-next', nextHref || '');

      if (ctaAction === 'paiement' || ctaAction === 'lien') {
        form.classList.add('hide');
        link.classList.remove('hide');
        link.href = (ctaAction === 'paiement' && isHttp(payOrUrl)) ? payOrUrl : (nextHref || '#');
      } else {
        form.classList.remove('hide');
        link.classList.add('hide');
      }
    })();

    // Témoignages / FAQ / Timer
    (function(){
      const gua = document.getElementById('gua');
      if (gua && cleanText(gua.textContent)) gua.classList.remove('hide');

      ['testi','faq'].forEach(id=>{
        const el=document.getElementById(id); if(!el) return;
        const inner=el.querySelector('div'); const txt=cleanText(inner? inner.textContent: '');
        if (txt) el.classList.remove('hide');
      });

      const evergreen = parseInt('{{timers.evergreenMinutes}}',10)||0;
      const deadlineISO = cleanText('{{timers.deadlineISO}}');
      const t = document.getElementById('timer');
      function render(sec){ if(sec<=0){ t.textContent='Offre expirée'; return; } const m=Math.floor(sec/60), s=sec%60; t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s'; }
      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      if(total>0){ t.classList.remove('hide'); (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })(); }
    })();

    // Pixels (facultatif)
    (function(){
      const fb='{{analytics.fbPixelId}}'.trim();
      if (fb){
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;
          n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src='https://connect.facebook.net/en_US/fbevents.js';
          s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script');
        fbq('init', fb); fbq('track','PageView');
      }
      const gtm='{{analytics.gtmId}}'.trim();
      if (gtm){
        var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtm.js?id='+encodeURIComponent(gtm);
        document.head.appendChild(s);
      }
    })();
  </script>
</body>
</html>
