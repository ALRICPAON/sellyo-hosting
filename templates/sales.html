<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>{{seo.metaTitle}}</title>
  <meta name="description" content="{{seo.metaDescription}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0b1220; --btn:#3b82f6; }
    body { margin:0; background:var(--bg); color:#fff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:24px; }
    header { display:flex; justify-content:center; padding:16px 0; }
    header img { max-height:56px; display:block; }
    .media img { max-width:80%; max-height:340px; display:block; margin:18px auto; border-radius:12px; }
    h1 { font-size:clamp(26px,3.3vw,40px); margin:8px 0 6px; text-align:center; }
    p.sub { opacity:.85; text-align:center; margin:0 0 16px; }
    .grid { display:grid; gap:18px; grid-template-columns:1fr; }
    @media(min-width:900px){ .grid { grid-template-columns:1.1fr .9fr; } }
    .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:18px; }
    .btn-primary { background:var(--btn); color:#fff; font-weight:700; border:0; border-radius:12px; padding:12px 18px; cursor:pointer; text-decoration:none; display:inline-block; }
    ul { margin:10px 0; padding-left:22px; }
  </style>
</head>
<body>
  <header><img src="{{brand.logoUrl}}" alt="" /></header>

  <main>
    <div class="media"><img src="{{media.imageUrl}}" alt="" /></div>

    <h1>{{copy.title}}</h1>
    <p class="sub">{{copy.subtitle}}</p>

    <div class="grid">
      <section class="card">
        <div>{{copy.productDescription}}</div>
        <div>{{copy.bullets}}</div>
        <div>{{copy.benefits}}</div>
        <div>{{copy.guarantee}}</div>
      </section>

      <aside class="card" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
        <a href="{{nextHref}}" class="btn-primary">{{copy.ctaText}}</a>
      </aside>
    </div>
  </main>
</body>
</html>
