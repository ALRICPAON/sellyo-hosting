<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement</title>
  <script src="https://js.stripe.com/v3"></script>
  <style>
    :root{--bg:#0b1220;--btn:#3b82f6;--text:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
    main{max-width:720px;margin:40px auto;padding:24px}
    header{display:flex;justify-content:center;margin-bottom:16px}
    #logo{max-height:48px;display:none}
    .card{background:#ffffff10;padding:16px;border-radius:12px}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;cursor:pointer;margin-top:12px}
    .muted{opacity:.75}
    ul{padding-left:18px}
    video,iframe,img{max-width:100%;border-radius:12px}
    #paypal-buttons{margin-top:10px}
  </style>
</head>
<body>
<main>
  <header><img id="logo" alt="Logo"></header>

  <h1 data-slot="headline">Finalisez votre commande</h1>
  <p class="muted" data-slot="subtitle"></p>

  <section id="hero-image" data-optional="image" style="display:none"><img id="hero-img" alt=""></section>
  <section id="hero-video" data-optional="video" style="display:none">
    <video id="hero-mp4" controls style="display:none"></video>
    <div id="hero-embed" style="aspect-ratio:16/9;display:none"></div>
  </section>

  <section class="card">
    <h3>Récapitulatif</h3>
    <p data-slot="productRecap"></p>
    <p data-slot="productDescription"></p>
    <p><strong>Prix :</strong> <span id="amount"></span> <span id="currency"></span></p>

    <!-- Stripe Checkout -->
    <button id="pay-btn"><span data-slot="cta">Payer par carte (Stripe)</span></button>
    <div class="muted" id="checkout-msg"></div>

    <!-- PayPal -->
    <div id="paypal-section" style="display:none">
      <div id="paypal-buttons"></div>
      <div class="muted" id="paypal-msg"></div>
    </div>
  </section>

  <section style="margin-top:16px">
    <h3>Questions fréquentes</h3>
    <div id="faqs"></div>
  </section>
</main>

<script type="module">
  import { injectSlots } from "./js/inject-content.js";

  const $ = (s)=>document.querySelector(s);
  const show = (el)=>{ if(el) el.style.display=""; };
  const hide = (el)=>{ if(el) el.style.display="none"; };
  const setText = (sel,v)=>{ const el=$(sel); if(!el) return false; const t=(v??"").toString().trim(); if(!t){ el.textContent=""; hide(el); return false; } el.textContent=t; show(el); return true; };

  function renderFaqs(list=[]) {
    const wrap = document.querySelector('section:has(#faqs)') || document.getElementById("faqs")?.closest("section");
    const host = document.getElementById("faqs");
    const items = Array.isArray(list)?list:[];
    if(!wrap || !host) return;
    if(!items.length){ host.innerHTML=""; hide(wrap); return; }
    host.innerHTML = items.map(f=>`
      <details><summary>${f.q || "Question"}</summary><p>${f.a || ""}</p></details>
    `).join("");
    show(wrap);
  }

  // Choisit le vrai fichier de la "page suivante"
  async function resolveNextUrl(userId, nextSlug){
    if(!nextSlug) return "";
    const repo = (location.pathname.split("/")[1] || "");
    const root = repo ? `/${repo}/` : "/";
    const base = `${location.origin}${root}`;
    try {
      const res = await fetch(`${base}tunnels/${encodeURIComponent(userId)}/${encodeURIComponent(nextSlug)}.json`, {cache:"no-store"});
      const cfgNext = res.ok ? await res.json() : null;
      const type = (cfgNext?.pageType || cfgNext?.type || "thankyou").toLowerCase();
      const map = { optin:"optin", sales:"sales", checkout:"checkout", thankyou:"thankyou", upsell:"sales", downsell:"sales", webinar:"sales" };
      const file = map[type] || "thankyou";
      return `${base}${file}.html?slug=${encodeURIComponent(nextSlug)}&userId=${encodeURIComponent(userId)}`;
    } catch {
      return `${base}thankyou.html?slug=${encodeURIComponent(nextSlug)}&userId=${encodeURIComponent(userId)}`;
    }
  }

  (async () => {
    const qs = new URLSearchParams(location.search);
    const slug = qs.get("slug");
    const uid  = qs.get("userId");

    const cfg = await injectSlots({ slug, page: "checkout" });

    // Texte & sections (masquage si vide)
    setText('[data-slot="subtitle"]', cfg.subtitle || "");
    const recapped = setText('[data-slot="productRecap"]', cfg.productRecap || cfg.productDescription || "");
    const described = setText('[data-slot="productDescription"]', cfg.productDescription || "");
    const recapSection = document.querySelector(".card");
    if (recapSection && !recapped && !described) hide(recapSection);

    renderFaqs(cfg.faqs || []);

    // Pricing (amount en unités "majeures", ex: 49.00)
    const currency = (cfg.pricing?.currency || cfg.currency || "EUR").toUpperCase();
    const amountMajor = Number(cfg.pricing?.amount ?? cfg.payment?.price ?? 0);
    $('#amount').textContent = amountMajor ? amountMajor.toFixed(2) : "—";
    $('#currency').textContent = currency;
    setText('[data-slot="cta"]', cfg.copy?.cta || "Payer maintenant");

    // Paramètres éventuels dans l'URL
    const priceFromUrl = qs.get("priceId");
    const linkFromUrl  = qs.get("paymentLink");
    const pkFromUrl    = qs.get("stripePk");
    const ppFromUrl    = qs.get("paypalClientId");

    // Sources effectives
    const priceId  = priceFromUrl || cfg.pricing?.priceId || cfg.payment?.stripePriceId || "";
    const payLink  = linkFromUrl  || cfg.payment?.paymentLink || cfg.paymentLink || "";
    const stripePk = pkFromUrl    || cfg.payment?.stripePublishableKey || cfg.stripePk || "";
    const paypalId = ppFromUrl    || cfg.payment?.paypalClientId || cfg.paypal?.clientId || "";

    // Détermination de l’URL success (merci/next)
    const nextSlug = cfg.flow?.nextSlug || (cfg.slug?.replace(/-p(\d+)$/, (_,n)=>`-p${(+n+1)}`) || "");
    const successUrl = await resolveNextUrl(uid, nextSlug || slug); // si pas de next → reload merci/suivant
    const cancelUrl  = location.href;

    // --- Stripe (Checkout) & Payment Link ---
    const payBtn = document.getElementById("pay-btn");
    const msg    = document.getElementById("checkout-msg");

    if (!priceId && !payLink) {
      msg.textContent = "Configuration Stripe incomplète (aucun priceId ni Payment Link).";
      payBtn.disabled = true;
    }

    payBtn.addEventListener("click", async () => {
      try {
        // 1) Payment Link direct
        if (payLink) { location.href = payLink; return; }

        // 2) Stripe Checkout (priceId requis)
        if (!stripePk) { msg.textContent = "Clé Stripe publique manquante (stripePk)."; return; }
        if (!priceId)  { msg.textContent = "Identifiant de prix manquant (priceId)."; return; }

        const stripe = window.Stripe(stripePk);
        const { error } = await stripe.redirectToCheckout({
          lineItems: [{ price: priceId, quantity: 1 }],
          mode: 'payment',
          successUrl,
          cancelUrl
        });
        if (error) msg.textContent = error.message || "Erreur Stripe.";
      } catch (e) {
        console.error("[checkout] stripe error", e);
        msg.textContent = "Erreur Stripe.";
      }
    });

    // --- PayPal Smart Buttons (optionnel) ---
    if (paypalId) {
      const wrap = document.getElementById("paypal-section");
      show(wrap);
      const ppMsg = document.getElementById("paypal-msg");

      const script = document.createElement("script");
      script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(paypalId)}&currency=${encodeURIComponent(currency)}`;
      script.onload = () => {
        if (!window.paypal) { ppMsg.textContent = "SDK PayPal non disponible."; return; }
        window.paypal.Buttons({
          style: { layout: "vertical", color: "gold", shape: "rect", label: "paypal" },
          createOrder: (data, actions) => actions.order.create({
            purchase_units: [{
              amount: { value: amountMajor.toFixed(2), currency_code: currency },
              description: cfg.copy?.headline || cfg.productRecap || cfg.slug
            }]
          }),
          onApprove: (data, actions) =>
            actions.order.capture().then(() => { location.href = successUrl; }),
          onError: (err) => { console.error("[checkout] PayPal error", err); ppMsg.textContent = "Erreur PayPal."; }
        }).render("#paypal-buttons");
      };
      script.onerror = () => { ppMsg.textContent = "Impossible de charger PayPal."; };
      document.head.appendChild(script);
    }
  })().catch(e => console.error("[checkout] inject error", e));
</script>
</body>
</html>
