  <style>
    :root {
      --bg: #1a0a53;
      --btn: #831100;
      --text: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);

    main {

    /* Timer */
    .timer{font-weight:800;text-align:center;margin:12px 0;font-size:20px;color:#facc15}
  </style>

  <!-- Paiement: Stripe Checkout client-only + fallbacks -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('payBtn');
    if (!btn) return;

    const clean   = (s)=> (s||"").toString().trim();
    const isToken = (s)=> /\{\{[^}]+\}\}/.test(s||"");
    const withSlash = (u)=> u ? (u.endsWith('/') ? u : (u + '/')) : "";

    // Champs (webhook 1.* / 133.*)
    const pk        = clean("pk_test_51RVsTD4PUVU3ejcHlK1AAkobBcOKPp3k0l9AHMmq68d7OdSDjyVKLtA9XpMGqiUIeIgtMvhSTUDrMl9rPityqi5u002UMlmdET");
    const priceId   = clean("price_1Rx31U4PUVU3ejcHtRO3U55v");
    const payLink   = clean("");
    const baseUrl0  = clean("https://alricpaon.github.io/sellyo-hosting/tunnels/pOoqftYacXhirXtjxVk60Or09nm2");
    const baseUrl   = withSlash(baseUrl0);

    const rawNext   = clean("sales10-rzda4-p3.html");
    const nextSlug  = clean("sales10-rzda4-p3");
    const nextHref  = (!isToken(rawNext) && rawNext) || (nextSlug ? (nextSlug + ".html") : "");

    const url       = clean("");
    const download  = clean("https://sellyo.fr/form-tunnel");

    // Afficher/Masquer le prix si vide ou token non remplacé
    const priceEl = document.getElementById('price');
    if (priceEl) {
      const raw = (priceEl.textContent || '').trim();
      if (!raw || /\{\{.+\}\}/.test(raw)) priceEl.style.display = 'none';
    }

    // Priorité: Stripe Checkout > Payment Link > next > url > download
    if (pk && priceId && nextHref) {
      const stripe = Stripe(pk);
      btn.onclick = async (e) => {
        e.preventDefault();
        const successUrl = baseUrl + nextHref; // Absolu
        const cancelUrl  = window.location.href;
        const { error } = await stripe.redirectToCheckout({
          lineItems: [{ price: priceId, quantity: 1 }],
          mode: "payment",
          successUrl,
          cancelUrl
        });
        if (error) console.warn("Stripe error:", error.message);
      };
      return;
    }

    if (payLink && !isToken(payLink)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = payLink; };
      return;
    }

    if (nextHref) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = nextHref; };
      return;
    }

    if (url && !isToken(url)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = url; };
      return;
    }

    if (download && !isToken(download)) {
      btn.onclick = (e) => { e.preventDefault(); window.location.href = download; };
      return;
    }

    // Sinon, cache le bouton (aucune action valable)
    btn.style.display = 'none';
  });
  </script>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  const val = (s)=> (s||"").toString().trim();
  const isToken = (s)=> /\{\{[^}]+\}\}/.test(s||"");

  const vidSrc = val("https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fsales10-rzda4%2Fpage2-video-1757496406546?alt=media&token=9870f22d-8c39-4c4b-8d61-ddf8cf49efe1");
  const imgSrc = val("https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fsales10-rzda4%2Fpage2-hero-1757496405244?alt=media&token=73aa2441-7ffd-471f-8004-4e0b48fab7e6");

  const wrap   = document.getElementById('media');
  const img    = document.getElementById('media-img');
  const video  = document.getElementById('media-video');
  const source = document.getElementById('media-video-src');

  const hasVid = vidSrc && !isToken(vidSrc);
  const hasImg = imgSrc && !isToken(imgSrc);

  if (!wrap) return;

  if (hasVid) {
    if (source) source.src = vidSrc;
    if (video) { video.style.display = 'block'; video.classList.remove('hide'); video.load(); }
    if (img)   img.style.display = 'none';
    wrap.style.display = 'flex';
  } else if (hasImg) {
    if (img)   { img.src = imgSrc; img.style.display = 'block'; }
    if (video) video.style.display = 'none';
    wrap.style.display = 'flex';
  } else {
    wrap.style.display = 'none';
  }
});
</script>

  <!-- Timer (evergreen ou deadline ISO) -->
  <script>
    (function(){
      const clean = (s)=> (s||"").toString().trim();
      const t = document.getElementById('timer');
      if(!t) return;

      const evergreen = parseInt('30',10) || 0;
      const deadlineISO = clean('');

      function render(sec){
        if(sec<=0){ t.textContent='Offre expirée'; return; }
        const m=Math.floor(sec/60), s=sec%60;
        t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s';
      }

      let total=0;
      if(evergreen>0) total=evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) {
        total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      }

      if(total>0){
        t.style.display='block';
        (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })();
      }
    })();
  </script>
