<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>{{seo.metaTitle}}</title>
<meta name="description" content="{{seo.metaDescription}}"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root{--bg:{{ui.mainColor}};--btn:{{ui.buttonColor}};--text:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px}
header{display:flex;justify-content:center;padding:16px 0}
header img{max-height:56px;display:block}
.card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
.hero{text-align:center;margin-bottom:16px}
.hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}
.sub{opacity:.9;margin:0}
.grid{display:grid;gap:18px}
.two{grid-template-columns:1fr}
@media(min-width:880px){.two{grid-template-columns:1.1fr .9fr}}
.media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;display:block}
.btn{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}
.btn-alt{background:#ffffff22}
.badge{display:inline-block;background:#22c55e;padding:6px 10px;border-radius:999px;font-weight:700}
.price{font-size:28px;font-weight:900;margin:6px 0}
.hide{display:none}
</style>
</head>
<body>
<header>
  <img src="{{brand.logoUrl}}" alt="Logo" onerror="this.style.display='none'">
</header>
<main>
  <section class="card hero">
    <h1>{{copy.title}}</h1>
    <p class="sub">{{copy.subtitle}}</p>
    <div class="badge hide" id="save">Économie spéciale</div>
  </section>

  <section class="grid two">
    <div class="card">
      <!-- Bloc média image/vidéo -->
      <div class="media" id="mwrap">
        <img id="img" src="{{media.imageUrl}}" alt="" onerror="this.style.display='none'">
        <video id="vid" src="{{media.videoMp4}}" controls playsinline onerror="this.style.display='none'"></video>
      </div>

      <!-- Prix dynamique -->
      <div id="price" class="price hide">{{payment.price}} {{payment.currency}}</div>

      <!-- Bouton principal (dynamique) -->
      <a id="buy" class="btn">{{copy.ctaText}}</a>

      <!-- Lien de refus / suite -->
      <a class="btn btn-alt" href="{{flow.nextHref}}">Je refuse l’offre</a>
    </div>

    <aside class="card">
      <div id="prob">{{copy.problem}}</div>
      <div id="sol">{{copy.solution}}</div>
      <div id="ben">{{copy.benefits}}</div>
      <div id="bul">{{copy.bullets}}</div>
    </aside>
  </section>

  <!-- Sections conditionnelles -->
  <section class="card hide" id="testi"><h3>Témoignages</h3><div>{{testimonials}}</div></section>
  <section class="card hide" id="faq"><h3>FAQ</h3><div>{{faqs}}</div></section>
</main>

<script>
const clean = s => (s || '').trim();
const stripGPT = t => t.replace(/```html?/gi,'').replace(/```/g,'');

// Gestion de l'affichage média image / vidéo
(function(){
  const img = document.getElementById('img');
  const vid = document.getElementById('vid');
  const wrap = document.getElementById('mwrap');
  const hasImg = !!clean(img.getAttribute('src'));
  const hasVid = !!clean(vid.getAttribute('src'));
  if(!hasVid && !hasImg) wrap.style.display = 'none';
  if(hasVid && hasImg) img.style.display = 'none';
})();

// Gestion affichage prix + badge économie + sections dynamiques
(function(){
  const p = document.getElementById('price');
  if(clean(p.textContent)) p.classList.remove('hide');

  const sv = document.getElementById('save');
  if(document.getElementById('prob').textContent) sv.classList.remove('hide');

  ['testi','faq'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const c = el.querySelector('div');
    if(c && clean(c.textContent)) {
      c.innerHTML = stripGPT(c.innerHTML);
      el.classList.remove('hide');
    }
  });
})();

// Gestion intelligente du bouton principal
(function(){
  const btn = document.getElementById('buy');
  const paymentLink = clean('{{payment.paymentLink}}');
  const next = clean('{{flow.nextHref}}');

  if(paymentLink && paymentLink !== '{{payment.paymentLink}}'){
    btn.href = paymentLink;
  } else if(next && next !== '{{flow.nextHref}}'){
    btn.href = next;
  } else {
    btn.classList.add('hide');
  }
})();

// Tracking pixels dynamique FB / GTM
(function(){
  const fb='{{analytics.fbPixelId}}'.trim();
  if(fb){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){
      n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;t.src='https://connect.facebook.net/en_US/fbevents.js';
      s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)
    }(window,document,'script');
    fbq('init',fb);fbq('track','PageView');
  }
  const gtm='{{analytics.gtmId}}'.trim();
  if(gtm){
    var s=document.createElement('script');
    s.async=1;s.src='https://www.googletagmanager.com/gtm.js?id='+gtm;
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
