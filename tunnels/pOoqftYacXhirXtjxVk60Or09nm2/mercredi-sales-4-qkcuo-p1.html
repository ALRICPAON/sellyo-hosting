<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>mercredi sales 4</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{ --bg: #004d65; --btn: #7b219f; --text:#fff }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.45}
    main{max-width:1100px;margin:0 auto;padding:24px}

    header{display:flex;justify-content:center;align-items:center;padding:16px 0}
    #logo{max-height:56px;display:none}

    .card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px}
    .hero{text-align:left;margin-bottom:18px}
    .hero h1{font-size:clamp(26px,3.4vw,40px);margin:6px 0}
    .hero .sub{opacity:.9;margin:0}

    .btn,button.cta{display:inline-block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-align:center;text-decoration:none;border:0;cursor:pointer}

    /* Grilles */
    .grid{display:grid;gap:18px}
    .col-2{grid-template-columns:1fr}
    @media(min-width:880px){ .col-2{ grid-template-columns:1fr 1fr; } }

    .media img,.media video{width:100%;max-height:440px;object-fit:cover;border-radius:12px;display:block}
    .media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block}

    .section-title{font-weight:800;margin:8px 0 10px}
    .muted{opacity:.85}
    .hide{display:none!important}

    /* (Optionnel) sur mobile, mettre la vidéo au-dessus du texte dans le bloc B
    @media (max-width:879px){
      #grid-b{display:flex;flex-direction:column}
      #media-b{order:-1}
    } */
  </style>
  <script src="https://js.stripe.com/v3"></script>
</head>
<body>
  <main>
    <header>
      <img id="logo" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fmercredi-sales-4-qkcuo%2Flogo-1757494025232?alt=media&token=b9dbcb03-257c-452a-ae55-c422add6c6d9" alt="Logo" onerror="this.style.display='none'">
    </header>

    <!-- HERO -->
    <section class="hero card">
      <h1 id="title">titre</h1>
      <p class="sub" id="subtitle">soustitre</p>
    </section>

    <!-- BLOC A : Image gauche | Texte + CTA droite -->
    <section class="card" id="block-a">
      <div class="grid col-2">
        <div class="media" id="media-a">
          <img id="img-a" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fmercredi-sales-4-qkcuo%2Fpage1-hero-1757494026771?alt=media&token=d237d605-2bf7-4007-be89-f62b258806f2" alt="" onerror="this.style.display='none'">
        </div>
        <div id="col-a-text">
          <div id="desc">description</div>
          <div id="bul">clé</div>
          <div id="gua"><em>garantie</em></div>
          <div id="timer" class="timer hide"></div>
          <button class="cta" id="cta-main">je test</button>
          <div id="dl-wrap" class="hide" style="margin-top:10px"></div>
        </div>
      </div>
    </section>

    <!-- BLOC B : TEXTE (gauche) | VIDÉO (droite). Sans vidéo → texte centré pleine largeur -->
    <section class="card" id="block-b">
      <div class="grid col-2" id="grid-b">
        <!-- TEXTE D’ABORD -->
        <div id="arguments">
          <div class="section-title">Problème</div>
          <div id="prob">problem</div>
          <div class="section-title">Solution</div>
          <div id="sol">solut</div>
          <div class="section-title">Bénéfices</div>
          <div id="ben">benef</div>
        </div>
        <!-- MÉDIA ENSUITE (donc à droite sur desktop) -->
        <div class="media" id="media-b">
          <video id="vid-b" src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fmercredi-sales-4-qkcuo%2Fpage1-video-1757494027817?alt=media&token=fc8000b5-14e9-4f44-81eb-77484b4098d8" controls playsinline class="hide" onerror="this.style.display='none'"></video>
          <iframe id="emb-b" src="" class="hide" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- Témoignages -->
    <section class="card hide" id="testi">
      <h3>Témoignages</h3>
      <div id="testi-body" data-alt="temoin">temoin</div>
    </section>

    <!-- FAQ -->
    <section class="card hide" id="faq">
      <h3>FAQ</h3>
      <div id="faq-body" data-alt="question">question</div>
    </section>

    <footer class="muted" style="text-align:center;margin-top:14px">&copy; mercredi sales 4</footer>
  </main>

  <script>
    /* ---------- Helpers ---------- */
    const clean = (s)=> (s||"").toString().trim();
    const isToken = (s)=> /\{\{[^}]+\}\}/.test((s||"").toString());
    const isHttp = (u)=>{ try{ const x=new URL((u||'').trim()); return x.protocol==='http:'||x.protocol==='https:'; }catch(_){ return false; } };

    // Logo visible seulement si src exploitable
    (function(){
      const logo=document.getElementById('logo');
      const src=clean(logo?.getAttribute('src'));
      if (logo && src && !isToken(src) && (/^(https?:|data:image)/i.test(src))) logo.style.display='block';
    })();

    // Bullets : JSON array → <ul>
    (function(){
      const host=document.getElementById('bul'); if(!host) return;
      const raw=clean(host.textContent);
      if(!raw || isToken(raw)) return;
      try{
        const arr=JSON.parse(raw);
        if(Array.isArray(arr)){
          host.innerHTML = '<ul>' + arr.map(x=>'\n<li>'+clean(x)+'</li>').join('') + '\n</ul>';
        }
      }catch(_){}
    })();

    // Liens de téléchargement (optionnels)
    (function(){
      const wrap=document.getElementById('dl-wrap'); if(!wrap) return;
      const file = clean('{{delivery.productFile}}');
      const url  = clean('{{delivery.productUrl}}');
      const pFile= clean('{{pageProductFile}}');
      const pUrl = clean('{{pageProductUrl}}');
      let html='';
      if(file && !isToken(file)) html += `<a class="btn" href="${file}" download>Télécharger le produit</a>`;
      else if(url && !isToken(url)) html += `<a class="btn" href="${url}" target="_blank">Accéder au produit</a>`;
      if(pFile && !isToken(pFile)) html += `<a class="btn" style="margin-top:8px" href="${pFile}" download>Télécharger le bonus</a>`;
      else if(pUrl && !isToken(pUrl)) html += `<a class="btn" style="margin-top:8px" href="${pUrl}" target="_blank">Voir le bonus</a>`;
      if(html){ wrap.innerHTML=html; wrap.classList.remove('hide'); }
    })();

    // ===== Bloc B : gestion vidéo / embed =====
    (function(){
      const vidB=document.getElementById('vid-b');
      const embB=document.getElementById('emb-b');
      const gridB=document.getElementById('grid-b');
      const args=document.getElementById('arguments');

      const mp4=clean('https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fmercredi-sales-4-qkcuo%2Fpage1-video-1757494027817?alt=media&token=fc8000b5-14e9-4f44-81eb-77484b4098d8');
      const emb=clean('{{media.videoEmbed}}');

      const hasVid = !!mp4 && !isToken(mp4) && isHttp(mp4);
      const hasEmb = !!emb && !isToken(emb) && isHttp(emb);

      // Reset
      [vidB,embB].forEach(el=>{ if(!el) return; el.classList.add('hide'); el.style.display='none'; });

      if(hasVid){ vidB.src=mp4; vidB.classList.remove('hide'); vidB.style.display='block'; }
      else if(hasEmb){ embB.classList.remove('hide'); embB.style.display='block'; }
      else {
        // Pas de vidéo → arguments pleine largeur
        gridB.classList.remove('col-2');
        gridB.style.gridTemplateColumns='1fr';
        args.style.maxWidth='760px'; args.style.margin='0 auto';
      }
    })();

    // Témoignages & FAQ (mêmes règles que l’optin)
    (function(){
      function has(v){ return !!(v && (""+v).trim() && !/\{\{[^}]+\}\}/.test(""+v)); }
      function showFromRaw(wrapId, bodyId, mapJson){
        const wrap=document.getElementById(wrapId), body=document.getElementById(bodyId);
        if(!wrap||!body) return;
        let raw=(body.textContent||'').trim();
        if(!has(raw)) raw=(body.getAttribute('data-alt')||'').trim();
        if(!has(raw)) return;
        let html='';
        try{ const data=JSON.parse(raw); html = mapJson(data); }catch(_){ html=raw; }
        if(has(html)){ body.innerHTML=html; wrap.classList.remove('hide'); }
      }
      showFromRaw('testi','testi-body', arr => Array.isArray(arr) ? arr.map(t=>`<div class="testimonial-item">“${(t&&t.text?t.text:t)||''}”</div>`).join('') : '');
      showFromRaw('faq','faq-body', arr => Array.isArray(arr) ? arr.map(x=>`<div class="faq-item"><strong>${(x&&x.q?x.q:(x&&x.question?x.question:''))}</strong><br/>${(x&&x.a?x.a:(x&&x.answer?x.answer:''))}</div>`).join('') : '');
    })();

    // Timer (evergreen / deadline)
    (function(){
      const t=document.getElementById('timer'); if(!t) return;
      const evergreen=parseInt('30',10)||0;
      const deadlineISO=clean('{{timers.deadlineISO}}');
      function render(sec){ if(sec<=0){ t.textContent='Offre expirée'; return; } const m=Math.floor(sec/60), s=sec%60; t.textContent='Offre expire dans '+m+'m '+('0'+s).slice(-2)+'s'; }
      let total=0;
      if(evergreen>0) total=evergreen*60; else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) total=Math.max(0,Math.floor((new Date(deadlineISO)-new Date())/1000));
      if(total>0){ t.classList.remove('hide'); (function tick(){ render(total--); if(total>=0) setTimeout(tick,1000); })(); }
    })();

    // CTA / Paiement / redirections
    (function(){
      const btn=document.getElementById('cta-main'); if(!btn) return;
      const withSlash=(u)=> u ? (u.endsWith('/') ? u : (u + '/')) : '';
      const pk=clean('pk_test_51RVsTD4PUVU3ejcHlK1AAkobBcOKPp3k0l9AHMmq68d7OdSDjyVKLtA9XpMGqiUIeIgtMvhSTUDrMl9rPityqi5u002UMlmdET');
      const priceId=clean('price_1Rx31U4PUVU3ejcHtRO3U55v');
      const payLink=clean('{{1.payment.paymentLink}}');
      const baseUrl=withSlash(clean('https://alricpaon.github.io/sellyo-hosting/tunnels/pOoqftYacXhirXtjxVk60Or09nm2'));
      const nextSlug=clean('mercredi-sales-4-qkcuo-p2');
      const rawNext=clean('mercredi-sales-4-qkcuo-p2.html');
      const nextHref = (!isToken(rawNext) && rawNext) || (nextSlug ? (nextSlug + '.html') : '');
      const url=clean('{{cta.url}}');
      const download=clean('https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Fmercredi-sales-4-qkcuo%2Fdelivery-product-1757494025895?alt=media&token=98b1d659-ba66-4415-a11b-ec72b5a75d2f');
      let rawMode='checkout';
      let mode = (!rawMode || isToken(rawMode)) ? 'payment' : clean(rawMode).toLowerCase();
      if(mode==='checkout') mode='payment';

      if(mode==='payment' && pk && priceId && nextHref){
        const stripe=Stripe(pk);
        btn.onclick=async (e)=>{
          e.preventDefault();
          const successUrl = baseUrl + nextHref;
          const cancelUrl  = window.location.href;
          const { error } = await stripe.redirectToCheckout({
            lineItems:[{ price: priceId, quantity:1 }],
            mode:'payment', successUrl, cancelUrl
          });
          if(error) console.warn('Stripe error:', error.message);
        };
        return;
      }
      if(mode==='payment' && payLink && !isToken(payLink)){
        btn.onclick=(e)=>{ e.preventDefault(); window.location.href=payLink; };
        return;
      }
      if(mode==='next' && nextHref){ btn.onclick=(e)=>{ e.preventDefault(); window.location.href=nextHref; }; return; }
      if(mode==='url' && url && !isToken(url)){ btn.onclick=(e)=>{ e.preventDefault(); window.location.href=url; }; return; }
      if(download && !isToken(download)){ btn.onclick=(e)=>{ e.preventDefault(); window.location.href=download; }; return; }
      btn.style.display='none';
    })();
  </script>

  <!-- Firebase (si besoin) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
  <script src="./firebase-init.js" type="module"></script>
</body>
</html>
