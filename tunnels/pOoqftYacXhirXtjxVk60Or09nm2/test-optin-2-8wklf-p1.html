  <script>
    // Helpers anti-parasites (trim, quotes)
    const cleanText = (s) => (s||"").replace(/^['"\s]+|['"\s]+$/g,'').trim();

    // Génère les inputs visibles à partir du JSON (clé → bool ou objet)
    (function(){
      const holder = document.getElementById('form-visible');
      const blob = document.getElementById('form-fields-json');
      let spec = {};

        let raw = blob.textContent || '';

        // tolérance : si le JSON est encadré de quotes, on retire
        if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) {
          raw = raw.slice(1, -1)
                   .replace(/\\"/g,'"')
                   .replace(/\\n/g,'')
                   .replace(/\\t/g,'');
        }
        try { spec = JSON.parse(raw); } catch(e){ spec = {}; }
      }

      // mapping simple: { name:true, firstname:true, email:true, phone:true, address:true, ... }
      const fieldsOrder = ['firstname','name','email','phone','company','jobTitle','website','address','address2','city','state','zip','country','age','gender','notes'];
      const labels = {
        firstname:'Prénom', name:'Nom', email:'Email', phone:'Téléphone',
        company:'Société', jobTitle:'Poste', website:'Site web',
        address:'Adresse', address2:"Complément d'adresse", city:'Ville', state:'État / Région', zip:'Code postal', country:'Pays',
        age:'Âge', gender:'Genre', notes:'Message'
      };

      const makeInput = (key, cfg) => {
        const type = (cfg && cfg.type) || (key==='email' ? 'email' : key==='phone' ? 'tel' : 'text');
        const req  = (cfg && cfg.required) || (key==='email');
        if (key === 'notes') {
          const ta = document.createElement('textarea');
          ta.name = key; ta.placeholder = labels[key] || key;
          ta.required = !!req;
          return ta;
        }
        if (key === 'gender') {
          const sel = document.createElement('select');
          sel.name = key;
          ['','Femme','Homme','Autre','Ne se prononce pas'].forEach((t,i)=>{
            const opt = document.createElement('option');
            opt.value = i? t.toLowerCase() : '';
            opt.textContent = i? t : 'Genre (optionnel)';
            sel.appendChild(opt);
          });
          return sel;
        }
        const input = document.createElement('input');
        input.name = key; input.type = type;
        input.placeholder = labels[key] || key;
        if (req) input.required = true;
        return input;
      };

      if (holder) {
        fieldsOrder.forEach(key=>{
          const val = spec && (spec[key] || (spec.fields && spec.fields[key]));
          if (val) {
            const cfg = (typeof val === 'object') ? val : {};
            holder.appendChild(makeInput(key, cfg));
          }
        });
      }
    })();

    // Affiche/masque les blocs vides
    (function(){

      if (img && !cleanText(img.getAttribute('src'))) img.style.display='none';

      // Timer
      const evergreen = parseInt('20',10)||0;
      const deadlineISO = cleanText('');
      const t = document.getElementById('timer');
      function renderTimer(sec){
        if(sec<=0){ t.textContent = 'Offre expirée'; return; }
        const m = Math.floor(sec/60), s = sec%60;
        t.textContent = 'Offre expire dans ' + m + 'm ' + ('0'+s).slice(-2) + 's';
      }
      let total = 0;
      if(evergreen>0) total = evergreen*60;
      else if(deadlineISO && !isNaN(Date.parse(deadlineISO))) total = Math.max(0, Math.floor((new Date(deadlineISO)-new Date())/1000));
      if(total>0){ t.classList.remove('hide'); const tick=()=>{renderTimer(total--); if(total>=0) setTimeout(tick,1000)}; tick(); }
    })();
