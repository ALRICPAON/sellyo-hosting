<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"/><title>test optin5</title>
<meta name="description" content=""/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root{--bg:#00364a;--btn:#0061ff;--text:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px}
header{display:flex;justify-content:center;padding:16px 0}header img{max-height:56px;display:block}
.card{background:#ffffff10;border:1px solid #ffffff14;border-radius:16px;padding:18px;margin:0 0 16px}
.hero{text-align:center}.hero h1{font-size:clamp(28px,3.5vw,42px);margin:8px 0}.sub{opacity:.9;margin:0}
.media img,.media video{width:100%;max-height:480px;object-fit:cover;border-radius:12px;display:block}
.btn{display:inline-block;width:auto;padding:12px 16px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;text-decoration:none;border:0;cursor:pointer}
.hide{display:none}
.grid{display:grid;gap:18px}
</style></head><body>
<header><img src="https://firebasestorage.googleapis.com/v0/b/sellyo-3bbdb.firebasestorage.app/o/tunnels%2FpOoqftYacXhirXtjxVk60Or09nm2%2Ftest-optin5-eughh%2Flogo-1755781288181?alt=media&token=951c95e0-aff8-4fe9-a4f1-0016e15ad462" alt="Logo" onerror="this.style.display='none'"></header>
<main>
  <section class="card hero hide" id="hero"><h1 id="ttl">personnalisé</h1><p class="sub" id="sub">Je pense pas que ça marche</p></section>
  <section class="card hide" id="media">
    <img id="img" src="" alt="" onerror="this.style.display='none'">
    <video id="vid" src="" controls playsinline onerror="this.style.display='none'"></video>
  </section>
  <section class="card hide" id="desc"><div>Je pense vraiment pas</div></section>
  <section class="card hide" id="copy"><div id="prob"></div><div id="sol"></div><div id="ben"></div><div id="bul"></div></section>
  <section class="card hide" id="cta">
    <a id="primary" class="btn" href="https://buy.stripe.com/test_aFa4gs1EO5jHbCe8aM6kg00">Continuer</a>
    <a id="next" class="btn" style="background:#ffffff22" href=".html">Continuer</a>
  </section>
  <section class="card hide" id="testi"><h3>Témoignages</h3><div></div></section>
  <section class="card hide" id="faq"><h3>FAQ</h3><div></div></section>
</main>

<script>
const clean=s=>(s||'').trim();
(function(){
  if(clean(document.getElementById('ttl').textContent) || clean(document.getElementById('sub').textContent))
    document.getElementById('hero').classList.remove('hide');

  const img=document.getElementById('img'), vid=document.getElementById('vid'); const hasImg=!!clean(img.getAttribute('src')), hasVid=!!clean(vid.getAttribute('src'));
  if(hasImg || hasVid) document.getElementById('media').classList.remove('hide');
  if(hasVid && hasImg) img.style.display='none';

  if(clean(document.querySelector('#desc > div').textContent)) document.getElementById('desc').classList.remove('hide');

  const hasCopy = ['prob','sol','ben','bul'].some(id=>clean(document.getElementById(id).textContent));
  if(hasCopy) document.getElementById('copy').classList.remove('hide');

  const pl='https://buy.stripe.com/test_aFa4gs1EO5jHbCe8aM6kg00'.trim(); const nx='.html'.trim();
  if((pl && pl!=='{{payment.paymentLink}}') || (nx && nx!=='{{flow.nextHref}}')) document.getElementById('cta').classList.remove('hide');
  if(!pl || pl==='{{payment.paymentLink}}') document.getElementById('primary').classList.add('hide');

  ['testi','faq'].forEach(id=>{const el=document.getElementById(id); if(!el) return; const c=el.querySelector('div'); if(c && clean(c.textContent)) el.classList.remove('hide');});
})();

// Pixels
(function(){
  const fb='123456'.trim(); if(fb){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;t.src='https://connect.facebook.net/en_US/fbevents.js';
  s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script'); fbq('init',fb); fbq('track','PageView');}
  const gtm='GTM'.trim(); if(gtm){var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtm.js?id='+gtm;document.head.appendChild(s)}
})();
</script>
</body></html>
